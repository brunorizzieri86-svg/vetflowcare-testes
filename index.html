<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VetFlowCare">
<title>VetFlowCare Pro - Gestão Veterinária</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --primary:#2DC0AE; --dark:#1E3A6E; --accent:#FF8C69;
  --bg:#EDF8F7; --surface:#FFFFFF; --text:#1A2F5A; --muted:#6B7A8D;
  --border:#D5EBE9; --success:#2DB37A; --warning:#F0A500; --danger:#E05252;
  --vac:#4E8EAC; --vacbg:#EEF4FA; --med:#2DB37A; --medbg:#EBF8F2;
  --vet:#E05252; --vetbg:#FDEEEE; --rx:#7C5CE4; --rxbg:#F3F0FD;
  --shadow:0 2px 10px rgba(26,47,90,.06);
}
body.dark{
  --bg:#0F1B2E; --surface:#1A2A44; --text:#E8F0F5; --muted:#8CA0B8;
  --border:#2A3D5C; --vacbg:#1E3350; --medbg:#16362C; --vetbg:#3A2028; --rxbg:#2A2450;
  --shadow:0 2px 10px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:16px;background:var(--surface);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
h2{font-size:20px;font-weight:900;letter-spacing:-.3px}
.hidden{display:none!important}
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#1E3A6E 0%,#163260 55%,#2DC0AE 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
#splash>*{flex-shrink:0}
#splash img{width:150px;height:150px;border-radius:30px;background:#fff;padding:10px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#splash .wm{margin-top:24px;font-size:36px;font-weight:900;letter-spacing:-1px}
#splash .wm .v{color:#fff}.wm .f{color:#2DC0AE}
#splash .care{font-family:Georgia,serif;font-style:italic;font-size:22px;color:#2DC0AE;margin-top:-4px}
#splash .pro{background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:800;letter-spacing:2px;padding:4px 14px;border-radius:14px;margin-top:10px}
#splash .tag{color:rgba(255,255,255,.55);font-size:11px;letter-spacing:2.5px;font-weight:600;margin-top:12px}
#splash button{margin-top:40px;width:100%;max-width:320px;background:#2DC0AE;color:#fff;padding:16px;border-radius:26px;font-size:16px;font-weight:800;box-shadow:0 8px 32px rgba(45,192,174,.5)}
#splash .sub{color:rgba(255,255,255,.4);font-size:11px;margin-top:12px}
/* v9.77 tentou corrigir o "pulo"/jank do scroll relatado pelo Bruno promovendo header/.sticky-toolbar
   a camadas de GPU próprias (translateZ(0)+will-change:transform). Revertido na v9.78: (1) o Bruno
   confirmou que o jank continua idêntico mesmo com essa mudança — não resolveu o problema real; e
   (2) essa promoção tem um efeito colateral sério, encontrado nesta rodada: um elemento
   position:fixed (o botão "+" flutuante de Pacientes, .fab) que fica DENTRO de um ancestral com
   transform/will-change deixa de se posicionar em relação à tela inteira e passa a se posicionar em
   relação a esse ancestral — foi exatamente isso que jogou o botão "+" em cima da barra de busca em
   vez de flutuar no canto inferior (ver JANK-001/FAB-001 na bancada). Como a promoção de camada não
   trouxe benefício comprovado e ainda quebrou esse botão, ela foi removida; a causa raiz do jank em
   si segue sob investigação (precisa de mais dados do aparelho do Bruno — ver bancada). */
header{background:linear-gradient(145deg,var(--dark) 0%,#1a3060 60%,rgba(45,192,174,.75) 100%);padding:16px 16px 20px;color:#fff;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:30}
/* Barra de ferramentas fixa dentro das abas (Pacientes/Financeiro/Agenda/Alertas): título, busca e
   filtros ficam parados no topo — só a lista abaixo rola. As margens negativas compensam o padding
   de 16px do <main>, para o fundo cobrir a largura toda sem deixar o conteúdo da lista "vazar" nas bordas. */
.sticky-toolbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:-16px -16px 12px -16px;padding:16px 16px 10px 16px}
.topbar{display:flex;align-items:center;gap:10px}
.topbar img{width:40px;height:40px;border-radius:10px;background:#fff;padding:3px;object-fit:contain}
.topbar .wm{font-weight:900;font-size:19px;letter-spacing:-.4px}
.topbar .wm .f{color:#7FE8DB}
.topbar .care{font-family:Georgia,serif;font-style:italic;font-size:12px;color:#7FE8DB;margin-top:-3px}
.topbar .spacer{flex:1}
.profile-chip{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;max-width:150px}
.profile-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* backdrop-filter:blur removido — dentro do cabeçalho fixo (position:sticky), esse blur força o
   navegador a reamostrar e desfocar tudo atrás do card a cada frame de rolagem, o que é a causa
   mais provável do "atraso/pulo" do cabeçalho fixo relatado no celular. Compensado com um fundo
   um pouco mais opaco para manter a leitura do card sem precisar do blur. */
.scorecard{margin-top:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:14px 16px}
.scorecard .lbl{font-size:10px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.6)}
.scorecard .row{display:flex;align-items:center;gap:14px;margin-top:8px}
.scorecard .big{font-size:17px;font-weight:900}
.scorecard .sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}
.scorecard .tag{font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.32);margin-top:10px;font-weight:600}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;font-weight:900}
main{padding:16px}
.sec{margin-bottom:20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-h span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.sec-h button{background:none;color:var(--primary);font-size:12px;font-weight:700;padding:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.card+.card{margin-top:8px}
.pets-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pet-card{flex:0 0 112px;background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:13px 8px;text-align:center;cursor:pointer}
.pet-card .emo{font-size:32px}
.pet-card .nm{font-weight:700;font-size:14px;margin-top:3px}
.pet-card .br{color:var(--muted);font-size:10px;margin:1px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-card .sl{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:3px}
.pet-add{flex:0 0 88px;background:var(--bg);border:2px dashed rgba(45,192,174,.5);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--primary);font-size:11px;font-weight:700}
.pet-add .plus{width:34px;height:34px;border-radius:50%;background:rgba(45,192,174,.15);display:flex;align-items:center;justify-content:center;font-size:20px}
.evt{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left-width:4px;border-radius:12px;padding:10px 13px;margin-bottom:8px;cursor:pointer}
.evt .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.evt .tx{flex:1;min-width:0}
.evt .t1{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt .t2{color:var(--muted);font-size:11px;margin-top:1px}
.evt .bd{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.banner{background:rgba(224,82,82,.08);border:1.5px solid var(--danger);border-radius:14px;padding:12px 15px;display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer}
.banner .n{width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.banner .t{flex:1}.banner .t b{color:var(--danger);font-size:13px;display:block}
.banner .t small{color:var(--danger);opacity:.75;font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;border-radius:22px;padding:12px 20px;font-size:14px;font-weight:700;width:100%}
.btn.sm{padding:7px 13px;font-size:12px;width:auto}
.btn.outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn.danger{background:var(--danger)}
.btn.dangero{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.success{background:var(--success)}
.btn.warn{background:var(--warning)}
.btn.gray{background:var(--border);color:var(--muted)}
.btn.rx{background:var(--rx)}
.modal{position:fixed;inset:0;background:rgba(15,27,46,.65);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.modal .sheet{width:100%;max-width:480px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;position:relative}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal .mh h2{font-size:17px}
.modal .mh .x{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.modal .mb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px;flex:1;min-height:0}
.scroll-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:70px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;padding:5px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;opacity:0;transition:opacity .25s;z-index:5;animation:scrollBounce 1.4s ease-in-out infinite;pointer-events:none}
@keyframes scrollBounce{0%,100%{bottom:70px}50%{bottom:64px}}
.modal .mf{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0;background:var(--surface)}
.modal.ov{z-index:300;align-items:center;justify-content:center;padding:22px}
.modal.ov .sheet{border-radius:22px;max-height:80vh;max-height:80dvh;max-width:400px;animation:vfcpop .18s ease;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal.ov .mf{border-top:none;padding-top:2px}
@keyframes vfcpop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:18px;padding:7px 13px;font-size:12px;font-weight:600}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.ptabs{display:flex;gap:3px;background:rgba(0,0,0,.15);border-radius:12px;padding:4px;margin-top:12px}
.ptabs button{flex:1;padding:9px 0;border-radius:10px;font-size:11px;font-weight:700;background:transparent;color:rgba(255,255,255,.8)}
.ptabs button.on{background:#fff;color:var(--dark)}
.irow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.irow:last-child{border-bottom:none}
.irow .k{color:var(--muted)}.irow .v{font-weight:600;text-align:right;max-width:58%}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.st.ok{background:rgba(45,179,122,.12);color:var(--success)}
.st.bad{background:rgba(224,82,82,.12);color:var(--danger)}
.st.soon{background:rgba(240,165,0,.12);color:var(--warning)}
.st.prog{background:rgba(78,142,172,.14);color:var(--vac)}
.tl-date{font-size:12px;font-weight:800;color:var(--warning)}
.tl-date.past{color:var(--vac)}
.subtabs{display:flex;gap:6px;margin-bottom:14px}
.subtabs .chip{flex:1;text-align:center;padding:9px 0;font-size:13px}
.wa-btn{width:38px;height:38px;border-radius:50%;background:#25D366;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:transform .12s}
.hbtn:active{transform:scale(.9);background:rgba(255,255,255,.32)}
.hbtn.hdanger{background:rgba(224,82,82,.3);border-color:rgba(255,160,160,.5)}
.fab{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;font-size:30px;font-weight:300;box-shadow:0 10px 26px rgba(45,192,174,.5);z-index:60;display:flex;align-items:center;justify-content:center;border:none}
.pick{position:relative}
.pick-list{max-height:190px;overflow-y:auto;background:var(--surface);border:1.5px solid var(--primary);border-radius:12px;margin-top:4px;box-shadow:0 8px 22px rgba(20,40,70,.14)}
.pick-row{padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.pick-row:last-child{border-bottom:none}
.pick-row:active{background:var(--bg)}
.pick-row span{color:var(--muted);font-size:11px;white-space:nowrap}
.pwwrap{position:relative}
.pwwrap input{padding-right:46px;width:100%;box-sizing:border-box}
.pwwrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;font-size:18px;padding:6px}
#splash .pwwrap{width:100%}
#splash .pwwrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;min-width:0;max-width:none;height:auto;padding:6px;margin:0;background:none;border:none;box-shadow:none;font-size:18px;font-weight:400;border-radius:0;letter-spacing:0;display:inline;color:inherit}
.dcells{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.dc .l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.dc .v{font-size:12px;font-weight:700;margin-top:1px}
.dc .v.red{color:var(--danger)}.dc .v.teal{color:var(--primary)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:15px;text-transform:capitalize}
.cal-head button{background:var(--bg);border-radius:50%;width:32px;height:32px;color:var(--muted);font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-day{text-align:center;padding:7px 0 4px;border-radius:10px;font-size:13px;cursor:pointer;position:relative;background:none;color:var(--text)}
.cal-day.today{background:rgba(45,192,174,.18);font-weight:900}
.cal-day.sel{background:var(--primary);color:#fff;font-weight:900}
.cal-day .dots{display:flex;justify-content:center;gap:2px;margin-top:2px;height:4px}
.cal-day .dots i{width:4px;height:4px;border-radius:50%;background:var(--primary)}
.cal-day .dots i.od{background:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:50%}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:10px}
.acard .ah{padding:5px 14px;font-size:11px;font-weight:800}
.acard .ab{padding:12px 13px;display:flex;align-items:center;gap:11px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.filters .chip{flex-shrink:0}
.switch{width:46px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:.2s;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch.on i{left:23px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.srow:last-child{border-bottom:none}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:50}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:9px;font-weight:600;position:relative;padding:4px 0}
nav button .nic{width:42px;height:28px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:19px}
nav button.on{color:var(--primary);font-weight:800}
nav button.on .nic{background:rgba(45,192,174,.14)}
nav .nbadge{position:absolute;top:0;right:calc(50% - 22px);width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:13px}
.empty .big{font-size:42px;margin-bottom:10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
canvas{width:100%!important}
.pet-hero{padding:16px 16px 0;color:#fff;border-radius:0 0 24px 24px}
.pet-hero .top{display:flex;justify-content:space-between;margin-bottom:12px}
.pet-hero .bk,.pet-hero .del{background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700}
.pet-hero .info{display:flex;align-items:flex-end;gap:13px;padding-bottom:12px}
.pet-hero .av{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;overflow:hidden}
.pet-hero .av img{width:100%;height:100%;object-fit:cover}
.pet-hero h2{font-size:24px;letter-spacing:-.5px}
.pet-hero .l1{font-size:13px;color:rgba(255,255,255,.82)}
.pet-hero .l2{font-size:11px;color:rgba(255,255,255,.62);margin-top:2px}
.doc-up{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.docrow{display:flex;align-items:center;gap:11px}
.docrow .di{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.upbox{border:2px dashed var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px}
.upbox img{max-height:60px;max-width:100%;object-fit:contain}
#installBanner{background:var(--dark);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px}
#installBanner button{background:var(--primary);color:#fff;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:700}
.rxcontent{white-space:pre-wrap;font-size:13px;color:var(--text);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;max-height:120px;overflow:hidden}

// em certos modos), usa Math.random. Nunca retorna vazio.
function makeDevId(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  try{
    if(window.crypto && crypto.getRandomValues){
      const r = crypto.getRandomValues(new Uint8Array(4));
      out = [...r].map(b => A[b % A.length]).join('');
    }
  }catch(e){ /* iOS/Safari pode barrar — cai no fallback abaixo */ }
  if(!/^[A-Z0-9]{4}$/.test(out)){
    out = '';
    for(let i=0;i<4;i++) out += A[Math.floor(Math.random()*A.length)];
  }
  return out;
}

function migrate(d){
  const base = defaultDB();
  d = Object.assign(base, d);
  d.vet = Object.assign(defaultDB().vet, d.vet||{});
  d.settings = Object.assign(defaultDB().settings, d.settings||{});
  d.license = Object.assign(defaultDB().license, d.license||{});
  d.charges = d.charges || [];
  d.expenses = d.expenses || [];
  // ID do Aparelho (licença Pro vinculada): 4 caracteres, criado uma única vez.
  // Vive dentro do DB — sobrevive a backup/restauração junto com os dados da clínica.
  // v9.9.2: geração blindada — no iPhone/Safari o crypto.getRandomValues pode falhar
  // (aba privada, iOS antigo), então caímos em Math.random para NUNCA ficar vazio.
  if(!d.devId || !/^[A-Z0-9]{4}$/.test(d.devId)) d.devId = makeDevId();
  d.pets = (d.pets||[]).map(normalizePet);
  d.tutors = (d.tutors||[]).map(normalizeTutor);
  // Converte campo antigo "tutor" (texto livre) em cadastro de tutor
  d.pets.forEach(p => {
    if(p.tutor && !p.tutorId){
      let t = d.tutors.find(x => x.name.toLowerCase() === p.tutor.toLowerCase());
      if(!t){ t = normalizeTutor({name: p.tutor}); d.tutors.push(t); }
      p.tutorId = t.id;
    }
  });
  return d;
}

let _saveTimer = null;

let _storageQueue=Promise.resolve();
function queueStorage(fn){const job=_storageQueue.then(fn,fn);_storageQueue=job.catch(()=>{});return job;}
async function encodeDatabase(key,auth,source=DB){
  if(!key)return JSON.stringify({...source,__auth:null});
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(source)));
  return JSON.stringify({__enc:1,__auth:auth,iv:b64e(iv),ct:b64e(new Uint8Array(ct))});
}
async function commitProtection(key,auth){
  clearTimeout(_saveTimer);
  return queueStorage(async()=>{
    const raw=await encodeDatabase(key,auth);
    // One atomic testStorage write commits BOTH ciphertext and its credentials.
    testStorage.setItem(LS_KEY,raw);
    window._cryptoKey=key;
    try{if(auth)testStorage.setItem(LS_AUTH,JSON.stringify(auth));else testStorage.removeItem(LS_AUTH);}catch(e){/* embedded auth remains authoritative */}
    agendarEspelho(raw);
  });
}
async function persistDB(){
  return queueStorage(async()=>{
    try{
      if(window._LOCKED || window._wiping) return false;
      const raw=await encodeDatabase(window._cryptoKey,getAuth());
      testStorage.setItem(LS_KEY,raw);
      agendarEspelho(raw);marcarAlteracao();salvarAssinatura();
      return true;
    }catch(e){console.warn('persist',e);toast('Não foi possível salvar. Verifique o armazenamento.');return false;}
  });
}
function b64e(u8){ let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function b64d(str){ const s=atob(str); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }

// ═══ IndexedDB — arquivos grandes (fotos/PDFs até 20MB) ═══
let _idb = null;
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('vetflowcare-tests', 3);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains('docs')) db.createObjectStore('docs');
      if(!db.objectStoreNames.contains('snap')) db.createObjectStore('snap');
      if(!db.objectStoreNames.contains('mirror')) db.createObjectStore('mirror');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbStore(store, mode, fn){
  return (async () => {
    _idb = _idb || await idbOpen();
    return new Promise((res, rej) => {
      const t = _idb.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : true);
      t.onerror = () => rej(t.error);
    });
  })();
}
async function idbPut(id, data){
  _idb = _idb || await idbOpen();
  return new Promise((res, rej) => {
    const t = _idb.transaction('docs', 'readwrite');
    t.objectStore('docs').put(data, id);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function idbGet(id){
  _idb = _idb || await idbOpen();
  return new Promise((res, rej) => {
    const t = _idb.transaction('docs', 'readonly');
    const q = t.objectStore('docs').get(id);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => rej(q.error);
  });
}
async function idbDel(id){
  _idb = _idb || await idbOpen();
  return new Promise((res) => {
    const t = _idb.transaction('docs', 'readwrite');
    t.objectStore('docs').delete(id);
    t.oncomplete = res; t.onerror = res;
  });
}

  if(!iso) return 9999;

function calcAge(birth){
  if(!birth) return '—';
  const b = new Date(birth), n = new Date();
  let y = n.getFullYear()-b.getFullYear(), mo = n.getMonth()-b.getMonth();
  if(mo < 0 || (mo===0 && n.getDate() < b.getDate())){ y--; mo += 12; }
  if(n.getDate() < b.getDate()) mo--;
  if(mo < 0){ y--; mo += 12; }
  if(y>0 && mo>0) return `${y} ${y===1?'ano':'anos'} e ${mo} ${mo===1?'mês':'meses'}`;
  if(y>0) return `${y} ${y===1?'ano':'anos'}`;
  return `${Math.max(mo,0)} ${mo===1?'mês':'meses'}`;
}

async function initDataProtection(){

  try{ await snapshotEscalonado(); }catch(e){ console.warn('snap', e); }
  // 2b) Se o armazenamento principal sumiu, resgata da cópia interna
  try{ await checarEspelhoNaAbertura(); }catch(e){ console.warn('espelho', e); }
  // 2c) Confere se algum volume de dados despencou desde a última sessão
  try{ conferirIntegridade(); }catch(e){ console.warn('integridade', e); }
  // 3) Estado corrompido resgatado?
  if(window._RESCUE){
    setTimeout(()=>{

        msg:'Os dados salvos não puderam ser lidos e foram <b>preservados num arquivo de resgate</b>.<br>Vá em Ajustes → Proteção de Dados para baixar o resgate ou restaurar um ponto automático.',

}
async function dailySnapshot(){
  const raw = testStorage.getItem(LS_KEY);
  if(!raw || raw.length < 60) return; // nada relevante para proteger
  const today = todayISO();
  const keys = await listSnapshots();
  if(keys.includes(today)) return;
  await idbStore('snap', 'readwrite', s => s.put(raw, today));

function getAuth(){
  try{
    const blob=JSON.parse(testStorage.getItem(LS_KEY)||'null');
    if(blob && Object.prototype.hasOwnProperty.call(blob,'__auth')) return blob.__auth;
    return JSON.parse(testStorage.getItem(LS_AUTH)||'null');
  }catch(e){return null;}
}
async function deriveKey(pass, saltU8){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations:150000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function makeCheck(key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode('vfc-ok'));
  return {iv:b64e(iv), ct:b64e(new Uint8Array(ct))};
}
async function verifyKey(key, check){
  try{
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(check.iv)}, key, b64d(check.ct));
    return new TextDecoder().decode(pt) === 'vfc-ok';
  }catch(e){ return false; }
}

async function unlockAppCore(){
  const auth = getAuth();
  const pass = document.getElementById('lockPass').value;
  const err = document.getElementById('lockErr');
  // Proteção contra tentativas em sequência (força bruta)
  const until = parseInt(testStorage.getItem('vfc_lock_until')||'0');
  if(Date.now() < until){
    err.textContent = `⏳ Muitas tentativas — aguarde ${Math.ceil((until-Date.now())/1000)}s`;
    return;
  }
  if(!pass){ err.textContent = 'Digite a senha'; return; }
  err.textContent = 'Verificando…';
  try{
    const key = await deriveKey(pass, b64d(auth.salt));
    if(!(await verifyKey(key, auth.check))){
      const tries = parseInt(testStorage.getItem('vfc_bad')||'0') + 1;
      testStorage.setItem('vfc_bad', tries);
      if(tries >= 5){
        testStorage.setItem('vfc_lock_until', Date.now() + 30000);
        testStorage.setItem('vfc_bad', '0');
        err.textContent = '⏳ 5 tentativas erradas — aguarde 30 segundos';
      } else {
        err.textContent = `⚠ Senha incorreta (${tries}/5)`;
      }
      return;
    }
    testStorage.removeItem('vfc_bad');
    testStorage.removeItem('vfc_lock_until');
    const blob = JSON.parse(testStorage.getItem(LS_KEY));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(blob.iv)}, key, b64d(blob.ct));
    window._cryptoKey = key;
    window._LOCKED = false;
    DB = migrate(JSON.parse(new TextDecoder().decode(pt)));
    document.getElementById('lockScreen').remove();
    bootApp();
  }catch(e){ err.textContent = '⚠ Erro ao desbloquear: ' + (e.message||e); console.warn(e); }
}

 window._wiping=true;clearTimeout(_saveTimer);clearTimeout(_mirrorTimer);

async function createAccountCore(email,p1,p2){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Informe um e-mail válido');return false;}
  if(p1.length<6){toast('Senha: mínimo de 6 caracteres');return false;}
  if(p1!==p2){toast('As senhas não conferem');return false;}
  if(!window.crypto?.subtle){toast('Abra o app em HTTPS para ativar a proteção.');return false;}
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));const key=await deriveKey(p1,salt);
    await commitProtection(key,{email,salt:b64e(salt),check:await makeCheck(key),createdAt:todayISO()});
    testStorage.removeItem('vfc_skip_lock');return true;
  }catch(e){toast('Não foi possível salvar a proteção. Seus dados anteriores foram mantidos.');return false;}
}

// Igual a fmtBRL, mas respeita a preferência de privacidade da aba Financeiro (botão do olho):
// usada só nas telas de EXIBIÇÃO do Financeiro — nunca em formulários de edição nem em PDFs.
function fmtBRLFin(v){ return DB.settings.finHideValues ? 'R$ ••••' : fmtBRL(v); }
function toggleFinValues(){ DB.settings.finHideValues = !DB.settings.finHideValues; save(); render(); }
// Máscara de moeda para inputs: formata "R$ 1.234,56" enquanto digita.
// O valor numérico real fica guardado em data-valor (em reais).
function maskMoeda(el){
  let dig = (el.value || '').replace(/\D/g, '');   // só dígitos = centavos
  if(!dig){ el.value = ''; el.dataset.valor = '0'; if(el.oninput)el._chg&&el._chg(); return; }
  dig = dig.replace(/^0+/, '') || '0';             // tira zeros à esquerda
  const num = parseInt(dig, 10) / 100;             // vira reais
  el.dataset.valor = String(num);
  el.value = 'R$ ' + num.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
// Lê o valor numérico real de um input com máscara de moeda
function moedaVal(el){
  if(!el) return 0;
  if(el.dataset.valor !== undefined && el.dataset.valor !== '') return parseFloat(el.dataset.valor)||0;
  return parseFloat((el.value||'').replace(/[^\d,]/g,'').replace(',','.'))||0;
}
// Formata um número inicial para exibição no input (ao abrir edição)
function moedaInit(v){
  v = parseFloat(v)||0;
  return v>0 ? 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '';
}
// Unifica atendimentos com valor + cobranças avulsas
// ── 💳 Taxas por meio de pagamento — motor de cálculo (100% offline) ──
// Meios: pix, dinheiro, debito, credito, creditoParc (crédito parcelado)
const MEIOS_PAG = {
  pix:        { label:'Pix',              emo:'⚡', prazo:'D+0'  },
  dinheiro:   { label:'Dinheiro',         emo:'💵', prazo:'D+0'  },
  debito:     { label:'Débito',           emo:'💳', prazo:'D+1'  },
  credito:    { label:'Crédito à vista',  emo:'💳', prazo:'D+30' },
  creditoParc:{ label:'Crédito parcelado',emo:'💳', prazo:'parcelado' }
};
// taxa (%) configurada para um meio; cai pra 0 se não houver
function taxaDoMeio(meio){
  const t = (DB.settings && DB.settings.taxas) || {};
  const v = t[meio];
  return (typeof v === 'number' && v >= 0) ? v : 0;
}
// valor líquido = bruto menos a taxa do meio de pagamento
function liquidoDe(valorBruto, meio){
  if(!meio || !(valorBruto > 0)) return valorBruto || 0;
  const taxa = taxaDoMeio(meio);
  return valorBruto * (1 - taxa/100);
}
// quanto a maquininha "comeu" (em R$)
function taxaValor(valorBruto, meio){
  if(!meio || !(valorBruto > 0)) return 0;
  return valorBruto * (taxaDoMeio(meio)/100);
}

function allReceivables(){
  const out = [];
  DB.pets.forEach(pet => {
    pet.appointments.forEach(a => {
      if(!(a.valor > 0 && a.payStatus)) return;
      if(a.parcelas && a.parcelas.length){
        a.parcelas.forEach((p, i) => {
          out.push({kind:'parc', id:a.id+'#'+i, petId:pet.id, petName:pet.name, emo:petEmoji(pet),
            desc:`${a.title}${a.resumo?' · '+a.resumo:''} (${i+1}/${a.parcelas.length})`,
            valor:p.valor, due:p.due, status:p.status, paidAt:p.paidAt||null, rem:p.rem, meioPag:a.meioPag||null});
        });
      } else {
        out.push({kind:'atend', id:a.id, petId:pet.id, petName:pet.name, emo:petEmoji(pet),
          desc:a.title + (a.resumo?' · '+a.resumo:''), valor:a.valor,
          due:a.payDue || a.date, status:a.payStatus, paidAt:a.paidAt||null, rem:a.rem, meioPag:a.meioPag||null});
      }
    });
  });
  DB.charges.forEach(c => {
    const pet = DB.pets.find(p=>p.id===c.petId);
    out.push({kind:'avulso', id:c.id, petId:c.petId,
      petName: pet ? pet.name : '(paciente removido)', emo: pet ? petEmoji(pet) : '🐾',
      desc:c.desc, valor:c.valor, due:c.due, status:c.status, paidAt:c.paidAt||null, rem:c.rem, meioPag:c.meioPag||null});
  });
  return out;
}
function goFinance(){
  showFinance = true; currentPetId = null; currentTutorId = null; finFilter='todos';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab==='fin'));
  render();
}

function renderFinance(){
  const all = allReceivables();
  const pend = all.filter(r=>r.status==='pendente');
  const lateArr = pend.filter(r=>daysUntil(r.due)<0);
  const lateTot = lateArr.reduce((s,r)=>s+r.valor,0);
  const naoAtrasados = pend.filter(r=>daysUntil(r.due)>=0);
  const tot = naoAtrasados.reduce((s,r)=>s+r.valor,0);
  const ymNow = todayISO().slice(0,7);
  let recebidos = all.filter(r => r.status==='pago' && (r.paidAt||'').startsWith(ymNow))
    .sort((a,b)=>(b.paidAt||'').localeCompare(a.paidAt||''));
  const totRecebido = recebidos.reduce((s,r)=>s+r.valor,0);

  // ═══ Privacidade: botão do olho — mostra/oculta todo R$ nesta aba (não altera os dados) ═══
  // "top" = cabeçalho fixo (navegação, abas, busca, resumo/filtros) — só a lista de lançamentos abaixo rola.
  const valoresOcultos = !!DB.settings.finHideValues;
  let top = `<button class="btn sm" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;background:${valoresOcultos?'var(--primary)':'var(--card,#fff)'};color:${valoresOcultos?'#fff':'var(--primary)'};border:1.5px solid var(--primary)"
    onclick="toggleFinValues()" aria-pressed="${valoresOcultos}">
    <span style="width:18px;height:18px;display:inline-flex">${accessIcon(valoresOcultos?'eye':'eyeoff')}</span>
    ${valoresOcultos?'Mostrar valores':'Ocultar valores'}</button>`;
  // ═══ Cabeçalho + navegação em 2 linhas ═══
  top += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <button class="btn sm gray" onclick="goTab(currentTab||'home')">‹</button>
    <h2 style="flex:1">💰 Financeiro</h2>
    ${finView==='rec'||finView==='atrasado'?`<button class="btn sm" onclick="openChargeForm()">➕ Cobrança</button>`:''}
    ${finView==='desp'&&isPro()?`<button class="btn sm" onclick="openExpenseForm()">➕ Despesa</button>`:''}</div>`;
  // Linha 1: Recebido / A Receber / Atrasado
  top += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px">
    <button class="chip ${finView==='receb'?'on':''}" style="justify-content:center;text-align:center" onclick="finView='receb';render()">🟢 Recebido</button>
    <button class="chip ${finView==='rec'?'on':''}" style="justify-content:center;text-align:center" onclick="finView='rec';render()">🟡 A Receber</button>
    <button class="chip ${finView==='atrasado'?'on':''}" style="justify-content:center;text-align:center" onclick="finView='atrasado';render()">🔴 Atrasado</button>
  </div>`;
  // Linha 2: Despesas / Fluxo
  top += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">
    <button class="chip ${finView==='desp'?'on':''}" style="justify-content:center;text-align:center" onclick="finView='desp';render()">🧾 Despesas${isPro()?'':' 🔒'}</button>
    <button class="chip ${finView==='fluxo'?'on':''}" style="justify-content:center;text-align:center" onclick="finView='fluxo';render()">📊 Fluxo${isPro()?'':' 🔒'}</button>
  </div>`;

  // Abas que têm tela própria
  if(finView === 'desp'){ const ex = renderExpenses(); return stickyToolbar(top + ex.toolbar) + ex.list; }
  if(finView === 'fluxo') return stickyToolbar(top) + renderFluxo();

  // Barra de busca (Recebido, A Receber, Atrasado)
  top += `<input placeholder="🔍 Buscar por paciente ou descrição…" value="${esc(finQ)}" style="margin-bottom:12px"
    oninput="finQ=this.value.toLowerCase();debQ(()=>{document.getElementById('mainContent').innerHTML=renderFinance();
    const i=document.querySelector('#mainContent input');i.focus();i.setSelectionRange(i.value.length,i.value.length)})">`;

  // ═══ helper: card de recebível ═══
  const cardRecebivel = (r) => {
    const d = daysUntil(r.due);
    const late = r.status==='pendente' && d<0;
    const pago = r.status==='pago';
    const dueLbl = pago ? `✓ Pago em ${fmtDate(r.paidAt)}` :
      late ? `⚠ Venceu em ${fmtDate(r.due)} (${Math.abs(d)}d)` :
      d===0 ? `🟡 Vence hoje` : `📅 Vence em ${fmtDate(r.due)} (${d}d)`;
    return `<div class="card" style="${late?'border-left:4px solid var(--danger)':pago?'border-left:4px solid var(--success)':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="min-width:0">
          <b style="font-size:14px">${r.emo} ${esc(r.petName)}</b>
          <div style="color:var(--muted);font-size:12px;margin-top:1px">${esc(r.desc)}${r.kind==='avulso'?' · avulso':''}</div>
          <div style="font-size:12px;font-weight:700;margin-top:4px;color:${pago?'var(--success)':late?'var(--danger)':d===0?'var(--warning)':'var(--muted)'}">${dueLbl}</div>
          ${r.meioPag ? `<div style="font-size:11px;color:var(--muted);margin-top:3px">${MEIOS_PAG[r.meioPag]?.emo||''} ${MEIOS_PAG[r.meioPag]?.label||''}${taxaDoMeio(r.meioPag)>0?` · taxa ${taxaDoMeio(r.meioPag)}%`:''}</div>`:''}</div>
        <div style="text-align:right;white-space:nowrap">
          <b style="font-size:16px;color:${pago?'var(--success)':'var(--text)'}">${fmtBRLFin(r.valor)}</b>
          ${r.meioPag && taxaDoMeio(r.meioPag)>0 ? `<div style="font-size:11px;color:var(--vac);font-weight:700;margin-top:1px">líq. ${fmtBRLFin(liquidoDe(r.valor, r.meioPag))}</div>`:''}
        </div></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        ${pago
          ? `<button class="btn sm gray" onclick="undoPaid('${r.kind}','${r.id}')">↩ Desfazer</button>`
          : `<button class="btn sm success" onclick="markPaid('${r.kind}','${r.id}')">✓ Recebido</button>
             <button class="btn sm" style="background:${isPro()?'#25D366':'var(--border)'};color:${isPro()?'#fff':'var(--muted)'}" onclick="cobrarWhats('${r.kind}','${r.id}')">💬 Cobrar${isPro()?'':' 🔒'}</button>`}
        ${!pago?`<button class="btn sm gray" onclick="openDueEdit('${r.kind}','${r.id}')">📅 Vencimento</button>`:''}
        <button class="btn sm outline" onclick="editReceivable('${r.kind}','${r.id}','${r.petId}')">✏️ Editar</button>
        <button class="btn sm dangero" onclick="delReceivable('${r.kind}','${r.id}')">🗑 Excluir</button>
      </div></div>`;
  };
  const aplicaBusca = arr => finQ ? arr.filter(r => r.petName.toLowerCase().includes(finQ) || (r.desc||'').toLowerCase().includes(finQ)) : arr;

  // ═══════════════════════════════════════
  //  🟢 ABA RECEBIDO
  // ═══════════════════════════════════════
  if(finView === 'receb'){
    const lista = aplicaBusca(recebidos);
    top += `<div class="card" style="margin-bottom:12px;background:rgba(45,179,122,.08);border-color:var(--success);text-align:center">
      <div style="font-size:10px;font-weight:700;color:var(--success);text-transform:uppercase">Total recebido · ${MONTHS[new Date().getMonth()]}</div>
      <div style="font-size:26px;font-weight:900;color:var(--success);margin-top:2px">${fmtBRLFin(totRecebido)}</div>
      <div style="font-size:11px;color:var(--muted)">${recebidos.length} ${recebidos.length===1?'recebimento':'recebimentos'}</div></div>`;
    const list = lista.length ? lista.map(cardRecebivel).join('')
      : `<div class="card empty"><div class="big">💸</div>Nenhum recebimento neste mês ainda</div>`;
    return stickyToolbar(top) + list;
  }

  // ═══════════════════════════════════════
  //  🔴 ABA ATRASADO
  // ═══════════════════════════════════════
  if(finView === 'atrasado'){
    const lista = aplicaBusca(lateArr).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
    top += `<div class="card" style="margin-bottom:12px;text-align:center;${lateArr.length?'background:rgba(224,82,82,.08);border-color:var(--danger)':''}">
      <div style="font-size:10px;font-weight:700;color:var(--danger);text-transform:uppercase">🔴 Total atrasado</div>
      <div style="font-size:26px;font-weight:900;margin-top:2px;color:${lateArr.length?'var(--danger)':'var(--muted)'}">${fmtBRLFin(lateTot)}</div>
      <div style="font-size:11px;color:var(--muted)">${lateArr.length} ${lateArr.length===1?'item vencido':'itens vencidos'}</div></div>`;
    const list = lista.length ? lista.map(cardRecebivel).join('')
      : `<div class="card empty"><div class="big">🎉</div>Nenhuma cobrança atrasada!</div>`;
    return stickyToolbar(top) + list;
  }

  // ═══════════════════════════════════════
  //  🟡 ABA A RECEBER (padrão)
  // ═══════════════════════════════════════
  // Resumo
  top += `<div class="card" style="margin-bottom:12px;text-align:center;background:rgba(240,165,0,.08);border-color:var(--warning)">
    <div style="font-size:10px;font-weight:700;color:var(--warning);text-transform:uppercase">🟡 Total a receber</div>
    <div style="font-size:26px;font-weight:900;color:var(--warning);margin-top:2px">${fmtBRLFin(tot)}</div>
    <div style="font-size:11px;color:var(--muted)">${naoAtrasados.length} ${naoAtrasados.length===1?'item':'itens'}${lateArr.length?` · +${fmtBRLFin(lateTot)} atrasado`:''}</div></div>`;

  // 1) Aviso de vencimentos em até 3 dias (PRIORIDADE no topo)
  DB.settings.payRem = DB.settings.payRem !== false;
  const lembrar = pend.filter(r => !r.rem && daysUntil(r.due) >= 0 && daysUntil(r.due) <= 3);
  if(DB.settings.payRem && lembrar.length){
    top += `<div class="card" style="border-color:var(--warning);margin-bottom:12px">
      <b style="font-size:13px">🔔 ${lembrar.length} ${lembrar.length===1?'cobrança vence':'cobranças vencem'} em até 3 dias</b>
      <div style="font-size:11px;color:var(--muted);margin:2px 0 8px">Toque em 💬 para enviar o lembrete pelo WhatsApp${isPro()?'':' (recurso Pro)'}</div>
      ${lembrar.slice(0,6).map(r=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;border-top:1px solid var(--border)">
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.emo} ${esc(r.petName)} · ${fmtBRLFin(r.valor)} · ${fmtDate(r.due)}</span>
        <button class="btn sm" style="background:#25D366" onclick="cobrarWhats('${r.kind}','${r.id}')">💬</button></div>`).join('')}
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;cursor:pointer">
        <input type="checkbox" checked onchange="DB.settings.payRem=this.checked;save();render()" style="accent-color:var(--primary)"> Avisar sobre vencimentos próximos</label>
    </div>`;
  }

  // 2) Filtros de ordenação por período
  const periodos = [
    ['hoje','Hoje', r=>daysUntil(r.due)===0],
    ['7d','7 dias', r=>daysUntil(r.due)>=0 && daysUntil(r.due)<=7],
    ['quinzenal','Quinzenal', r=>daysUntil(r.due)>=0 && daysUntil(r.due)<=15],
    ['mensal','Mensal', r=>daysUntil(r.due)>=0 && daysUntil(r.due)<=30],
    ['todos','Todos', r=>daysUntil(r.due)>=0]
  ];
  if(!periodos.find(p=>p[0]===finFilter)) finFilter = 'todos';
  top += `<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px">${periodos.map(([k,l,fn])=>{
    const n = naoAtrasados.filter(fn).length;
    return `<button class="chip ${finFilter===k?'on':''}" style="white-space:nowrap;flex-shrink:0" onclick="finFilter='${k}';render()">${l} (${n})</button>`;
  }).join('')}</div>`;

  // 3) Lista filtrada e ordenada por data
  const fdef = periodos.find(p=>p[0]===finFilter) || periodos[4];
  let lista = aplicaBusca(naoAtrasados.filter(fdef[2])).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  const list = lista.length ? lista.map(cardRecebivel).join('')
    : `<div class="card empty"><div class="big">🎉</div>Nada a receber neste período!</div>`;
  return stickyToolbar(top) + list;
}


function openDueEdit(kind, id){
  const list = allReceivables();
  const r = list.find(x=>x.kind===kind && x.id===id); if(!r) return;
  showSheet('📅 Alterar Vencimento', `
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">${r.emo} ${esc(r.petName)} · ${esc(r.desc)} · <b>${fmtBRL(r.valor)}</b></div>
    <label>Novo vencimento *</label>
    <input id="fDueNew" placeholder="DD/MM/AAAA" inputmode="numeric" maxlength="10"
      value="${fmtDate(r.due)}" oninput="maskDate(this)">`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button>
     <button class="btn" onclick="saveDueEdit('${kind}','${id}')">💾 Salvar</button>`);
}
function saveDueEdit(kind, id, force){
  const d = parseBRDate(val('fDueNew'));
  if(!d){ toast('⚠ Data inválida — use DD/MM/AAAA'); return; }
  if(!force && daysUntil(d) < 0){
    confirmPastDate(d, `saveDueEdit('${kind}','${id}',1)`, 'Vencimento da cobrança.');
    return;
  }
  const r = findRec(kind, id); if(!r) return;
  if(r.__parc) r.p.due = d;
  else if(kind==='avulso') r.due = d;
  else r.payDue = d;
  save(); closeSheet(); render(); toast('📅 Vencimento atualizado!');
}
// ═══ ANÁLISE POR PERÍODO: Previsão × Realizado ═══
function setFinPA(campo, v){ finPA[campo] = v; refreshFin(); }
function refreshFin(){ document.getElementById('mainContent').innerHTML = renderFinance(); }
function finPAQuick(tipo){
  const now = new Date();
  const iso2br = iso => fmtDate(iso);
  if(tipo==='mes'){
    finPA.ini = iso2br(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`);
    finPA.fim = iso2br(todayISO());
  } else if(tipo==='mespass'){
    const d1 = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const d2 = new Date(now.getFullYear(), now.getMonth(), 0);
    finPA.ini = iso2br(d1.toISOString().slice(0,10));
    finPA.fim = iso2br(d2.toISOString().slice(0,10));
  } else if(tipo==='30d'){
    finPA.ini = iso2br(addDays(todayISO(), -30));
    finPA.fim = iso2br(todayISO());
  } else { finPA.ini=''; finPA.fim=''; }
  refreshFin();
}
function renderPeriodoCard(all){
  const ini = parseBRDate(finPA.ini), fim = parseBRDate(finPA.fim);
  const valido = ini && fim && ini <= fim;
  let corpo = '';
  if(valido){
    const inR = s => s && s >= ini && s <= fim;
    const previsto  = all.filter(r=>inR(r.due)).reduce((s,r)=>s+r.valor,0);
    const realizado = all.filter(r=>r.status==='pago' && inR(r.paidAt)).reduce((s,r)=>s+r.valor,0);
    const emAtraso  = all.filter(r=>r.status==='pendente' && inR(r.due) && daysUntil(r.due)<0).reduce((s,r)=>s+r.valor,0);
    const aVencer   = all.filter(r=>r.status==='pendente' && inR(r.due) && daysUntil(r.due)>=0).reduce((s,r)=>s+r.valor,0);
    const desp = DB.expenses.filter(e=>inR(e.date)).reduce((s,e)=>s+e.valor,0);
    const taxa = previsto > 0 ? Math.round(realizado/previsto*100) : (realizado>0?100:0);
    const dif = realizado - previsto;
    const encerrado = fim < todayISO();
    const maxB = Math.max(previsto, realizado, 1);
    const bar = (v,cor) => `<div style="flex:1;height:11px;background:var(--bg);border-radius:6px"><div style="height:100%;width:${Math.min(100,Math.round(v/maxB*100))}%;background:${cor};border-radius:6px"></div></div>`;
    corpo = `
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <span class="st ${encerrado?'ok':'prog'}" style="font-size:10px">${encerrado?'📊 Período encerrado — Previsão × Realizado':'⏳ Período em andamento — resultado parcial'}</span>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <span style="font-size:11px;min-width:74px;color:var(--muted)">Previsto</span>${bar(previsto,'var(--vac)')}
        <b style="font-size:11px;min-width:76px;text-align:right;color:var(--vac)">${fmtBRL(previsto)}</b></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:5px">
        <span style="font-size:11px;min-width:74px;color:var(--muted)">Realizado</span>${bar(realizado,'var(--success)')}
        <b style="font-size:11px;min-width:76px;text-align:right;color:var(--success)">${fmtBRL(realizado)}</b></div>

function findRec(kind, id){
  if(kind==='avulso') return DB.charges.find(c=>c.id===id);
  if(kind==='parc'){
    const [aid, idx] = id.split('#');
    for(const pet of DB.pets){
      const a = pet.appointments.find(x=>x.id===aid);
      if(a && a.parcelas) return {__parc:true, a, p:a.parcelas[parseInt(idx)]};
    }
    return null;
  }
  for(const pet of DB.pets){
    const a = pet.appointments.find(x=>x.id===id);
    if(a) return a;
  }
  return null;
}
function markPaid(kind, id){
  const r = findRec(kind, id); if(!r) return;
  if(r.__parc){
    r.p.status = 'pago'; r.p.paidAt = todayISO();
    if(r.a.parcelas.every(p=>p.status==='pago')){ r.a.payStatus='pago'; r.a.paidAt=todayISO(); }
  }
  else if(kind==='avulso'){ r.status='pago'; r.paidAt = todayISO(); }
  else { r.payStatus='pago'; r.paidAt = todayISO(); }
  save(); render(); toast('✅ Pagamento recebido!');
}
function undoPaid(kind, id){
  const r = findRec(kind, id); if(!r) return;
  if(r.__parc){ r.p.status='pendente'; r.p.paidAt=null; r.a.payStatus='pendente'; r.a.paidAt=null; }
  else if(kind==='avulso'){ r.status='pendente'; r.paidAt = null; }
  else { r.payStatus='pendente'; r.paidAt = null; }
  save(); render(); toast('↩ Voltou para pendente');
}
function markApptDone(petId, aid){
  const pet = DB.pets.find(p=>p.id===petId); if(!pet) return;
  const a = pet.appointments.find(x=>x.id===aid); if(!a) return;
  a.done = 1;
  save(); render(); toast('✓ Atendimento marcado como realizado!');
}
function markReminded(kind, id){
  const r = findRec(kind, id); if(!r) return;
  if(r.__parc) r.p.rem = 1; else r.rem = 1;
  save();
}
function delChargeItem(id){
  const c = DB.charges.find(x=>x.id===id);
  askDel('💰 Excluir cobrança', `Deseja excluir a cobrança <b>${esc(c?.desc||'')}</b> de <b>${fmtBRL(c?.valor)}</b>?`, `doDelChargeItem('${id}')`);
}
function doDelChargeItem(id){
  DB.charges = DB.charges.filter(c=>c.id!==id);
  save(); render(); toast('🗑️ Cobrança excluída');
}
// ── Editar/Excluir QUALQUER lançamento do financeiro (avulso, atendimento, parcela) ──
function editReceivable(kind, id, petId){
  if(kind==='avulso'){ openChargeForm(id); return; }
  const aid = kind==='parc' ? id.split('#')[0] : id;
  const pet = DB.pets.find(p => p.id===petId) || DB.pets.find(p => p.appointments.some(a=>a.id===aid));
  if(!pet){ toast('⚠ Atendimento não encontrado'); return; }
  openApptForm(pet.id, aid);
}
function delReceivable(kind, id){
  if(kind==='avulso'){ delChargeItem(id); return; }
  const r = allReceivables().find(x=>x.kind===kind && x.id===id);
  if(!r){ toast('⚠ Lançamento não encontrado'); return; }
  if(kind==='parc'){
    askDel('💳 Excluir parcela',
      `Excluir a parcela <b>${esc(r.desc)}</b> de <b>${fmtBRL(r.valor)}</b>?<br><span style="font-size:12px;color:var(--muted)">O atendimento continua na ficha do paciente. As demais parcelas são mantidas.</span>`,
      `doDelReceivable('parc','${id}')`);
  } else {
    askDel('💰 Excluir cobrança do atendimento',
      `Remover a cobrança de <b>${fmtBRL(r.valor)}</b> deste atendimento?<br><span style="font-size:12px;color:var(--muted)">O atendimento e o prontuário permanecem na ficha — só o valor sai do Financeiro.</span>`,
      `doDelReceivable('atend','${id}')`);
  }
}
function doDelReceivable(kind, id){
  if(kind==='atend'){
    for(const pet of DB.pets){
      const a = pet.appointments.find(x=>x.id===id);
      if(a){ a.valor = 0; a.payStatus = null; a.payDue = null; a.paidAt = null; a.parcelas = null; a.itens = null; break; }
    }
    save(); render(); toast('🗑️ Cobrança removida do Financeiro');
    return;
  }
  const [aid, idxStr] = id.split('#');
  const idx = parseInt(idxStr);
  for(const pet of DB.pets){
    const a = pet.appointments.find(x=>x.id===aid);
    if(!a || !a.parcelas) continue;
    a.parcelas.splice(idx, 1);
    if(a.parcelas.length === 0){
      a.valor = 0; a.payStatus = null; a.payDue = null; a.paidAt = null; a.parcelas = null; a.itens = null;
    } else {
      a.valor = a.parcelas.reduce((s,p)=>s+p.valor, 0);
      a.payDue = a.parcelas[0].due;
      if(a.parcelas.length === 1){
        const p0 = a.parcelas[0];
        a.payStatus = p0.status; a.payDue = p0.due; a.paidAt = p0.paidAt || null;
        a.parcelas = null;
      } else if(a.parcelas.every(p=>p.status==='pago')){
        a.payStatus = 'pago';
      }
    }
    break;
  }
  save(); render(); toast('🗑️ Parcela excluída');
}
// ═══ AVISOS AO TUTOR PELO WHATSAPP ═══
// Um só caminho para lembrar o tutor de atendimento, vacina, medicação ou
// mandar um recado livre. Abre uma tela com o texto pronto e editável — o
// veterinário confere antes de enviar, porque cada tutor tem um jeito.
function waPhone(t){ return (t?.phone || '').replace(/\D/g, ''); }
function firstName(t){ return (t?.name || '').trim().split(' ')[0] || 'tutor(a)'; }
function vetSign(){
  const n = DB.vet.name || '';
  return n ? `\n\n${n}${crmvFull() ? ' · ' + crmvFull() : ''} 🐾` : '\n\n🐾';
}
// Monta o texto sugerido conforme o assunto
function avisoTexto(pet, tipo, refId){
  const t = tutorOf(pet);
  const ola = `Olá, ${firstName(t)}! 😊`;
  if(tipo === 'atend'){
    const a = pet.appointments.find(x => x.id === refId);
    if(!a) return ola + vetSign();
    const quando = `${fmtDate(a.date)}${a.time ? ' às ' + a.time : ''}`;
    const past = daysUntil(a.date) < 0;
    return past
      ? `${ola}\n\nEstou passando para saber como está o(a) ${pet.name} depois do atendimento de ${quando} (${a.title}).\n\nQualquer dúvida, é só me chamar!${vetSign()}`
      : `${ola}\n\nLembrete do atendimento do(a) ${pet.name}: ${a.title}, no dia ${quando}.${a.clinic ? `\nLocal: ${a.clinic}` : ''}\n\nSe precisar remarcar, é só me avisar!${vetSign()}`;
  }
  if(tipo === 'vacina'){
    const v = pet.vaccines.find(x => x.id === refId);
    if(!v) return ola + vetSign();
    const d = daysUntil(v.due);
    const sit = d < 0
      ? `está com a vacina *${v.name}* atrasada desde ${fmtDate(v.due)}`
      : d === 0 ? `tem a vacina *${v.name}* marcada para hoje`
      : `tem a vacina *${v.name}* prevista para ${fmtDate(v.due)}`;
    return `${ola}\n\nO(A) ${pet.name} ${sit}.\n\nVamos agendar a aplicação? Me avise o melhor dia para você.${vetSign()}`;
  }
  if(tipo === 'med'){
    const m = pet.medications.find(x => x.id === refId);
    if(!m) return ola + vetSign();
    return `${ola}\n\nLembrete da medicação do(a) ${pet.name}:\n*${m.name}* — ${m.dosage}, ${m.freq} às ${m.time}.\n\nQualquer reação diferente, me avise na hora.${vetSign()}`;
  }
  if(tipo === 'confirma'){
    const a = pet.appointments.find(x => x.id === refId);
    if(!a) return ola + vetSign();
    const quando = `${fmtDate(a.date)}${a.time ? ' às ' + a.time : ''}`;
    return `${ola}\n\nPassando para *confirmar* o atendimento do(a) *${pet.name}*: ${a.title}, no dia ${quando}.${a.clinic ? `\nLocal: ${a.clinic}` : ''}\n\nPodemos confirmar? Se precisar remarcar, é só me avisar. 🐾${vetSign()}`;
  }
  return `${ola}\n\nEstou entrando em contato sobre o(a) ${pet.name}.${vetSign()}`;
}

// ═══ DESPESAS (Pro) ═══
const EXP_CATS = ['Serviços/Procedimentos','Materiais','Medicamentos','Transporte','Equipamentos','Laboratório','Outros'];
function renderExpenses(){
  if(!isPro()) return { toolbar:'', list: `<div class="card" style="cursor:pointer" onclick="openProModal('O controle de despesas é um recurso Pro.')">
    <div style="font-size:14px">🔒 <b>Controle de Despesas</b></div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">Registre gastos com materiais, medicamentos, transporte etc. e acompanhe o saldo real no fluxo mensal — disponível no <b style="color:var(--rx)">✨ Pro</b>.</div></div>` };
  const now = new Date();
  const md = new Date(now.getFullYear(), now.getMonth() + finExpM, 1);
  const ym = md.toISOString().slice(0,7);
  const todas = finExpView === 'all';

  // Base do período: mês selecionado OU todas as datas (corrige a despesa "sumida")
  let base = todas ? DB.expenses.slice() : DB.expenses.filter(e => (e.date||'').startsWith(ym));
  const totPeriodo = base.reduce((s,e)=>s+e.valor,0);

  // Totais por categoria, calculados sobre o período todo (antes do filtro de categoria)
  const byCat = {};
  base.forEach(e => { byCat[e.cat||'Outros'] = (byCat[e.cat||'Outros']||0) + e.valor; });
  const maxCat = Math.max(1, ...Object.values(byCat));

  let lista = base.slice();
  if(finExpCat !== 'all') lista = lista.filter(e => (e.cat||'Outros') === finExpCat);

  // Cabeçalho: alterna entre "por mês" e "todas as datas"
  let top = `<div class="chips" style="margin-bottom:10px">
    <button class="chip ${!todas?'on':''}" onclick="finExpView='mes';render()">📅 Por mês</button>
    <button class="chip ${todas?'on':''}" onclick="finExpView='all';render()">🗂️ Todas as datas</button>
  </div>`;

  if(!todas){
    const mdPrev = new Date(md.getFullYear(), md.getMonth()-1, 1);
    const ymPrev = mdPrev.toISOString().slice(0,7);
    const totPrev = DB.expenses.filter(e=>(e.date||'').startsWith(ymPrev)).reduce((s,e)=>s+e.valor,0);
    const totAno = DB.expenses.filter(e=>(e.date||'').startsWith(String(md.getFullYear()))).reduce((s,e)=>s+e.valor,0);
    const delta = totPrev > 0 ? Math.round((totPeriodo - totPrev) / totPrev * 100) : null;
    top += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="btn sm gray" onclick="finExpM--;render()">‹</button>
      <b style="flex:1;text-align:center;font-size:15px">${MONTHS[md.getMonth()]} ${md.getFullYear()}</b>
      <button class="btn sm gray" ${finExpM>=0?'disabled style="opacity:.4"':''} onclick="finExpM++;render()">›</button></div>

    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Total de despesas</div>
        <b style="font-size:18px;color:var(--danger)">${fmtBRLFin(totPeriodo)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px">
        <span>${delta === null ? 'Sem despesas no mês anterior' :
          delta > 0 ? `<b style="color:var(--danger)">↑ ${delta}%</b> vs mês anterior` :
          delta < 0 ? `<b style="color:var(--success)">↓ ${Math.abs(delta)}%</b> vs mês anterior` : '= igual ao mês anterior'}</span>
        <span>Ano ${md.getFullYear()}: <b style="color:var(--text)">${fmtBRLFin(totAno)}</b></span></div>
      ${cartaoCategorias(byCat, maxCat)}
    </div>`;
  } else {
    top += `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Todas as despesas</div>
        <b style="font-size:18px;color:var(--danger)">${fmtBRLFin(totPeriodo)}</b></div>
      <div style="font-size:11px;color:var(--muted);margin-top:5px">${base.length} lançamento${base.length===1?'':'s'} no total, de todas as datas</div>
      ${cartaoCategorias(byCat, maxCat)}
    </div>`;
  }

  top += `<div class="chips" style="margin-bottom:10px">
    <button class="chip ${finExpCat==='all'?'on':''}" onclick="finExpCat='all';render()">Todas</button>
    ${EXP_CATS.map(c=>`<button class="chip ${finExpCat===c?'on':''}" onclick="finExpCat='${c}';render()">${c}</button>`).join('')}
  </div>`;

  if(!lista.length) return { toolbar: top, list: `<div class="card empty"><div class="big">🧾</div>Nenhuma despesa ${finExpCat!=='all'?'nesta categoria':(todas?'cadastrada':'neste mês')}<br><small>${todas?'Toque em "➕ Despesa" para começar':'Tente "🗂️ Todas as datas" acima, ou toque em "➕ Despesa"'}</small></div>` };

  // Agrupa por mês quando estiver na visão "Todas as datas"
  const ordenada = [...lista].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let mesAtual = '';
  let list = '';
  ordenada.forEach(e => {
    if(todas){
      const emes = (e.date||'').slice(0,7);
      if(emes !== mesAtual){
        mesAtual = emes;
        const [yy,mm] = emes.split('-');
        const rot = mm ? `${MONTHS[parseInt(mm)-1]} ${yy}` : 'Sem data';
        const totDoMes = ordenada.filter(x=>(x.date||'').slice(0,7)===emes).reduce((s,x)=>s+x.valor,0);
        list += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px">
          <b style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">${rot}</b>
          <b style="font-size:12px;color:var(--danger)">${fmtBRLFin(totDoMes)}</b></div>`;
      }
    }
    const futura = daysUntil(e.date) > 0;
    list += `<div class="card" style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0">
        <b style="font-size:14px">${esc(e.desc)}</b>

        <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(e.cat||'Outros')} · ${fmtDate(e.date)}${futura?' <span style="color:var(--vac);font-weight:700">· futura</span>':''}</div></div>

  'Transporte':'#4E8EAC', 'Equipamentos':'#9B6BCC', 'Laboratório':'#2DC0AE', 'Outros':'#6B7A8D'

function corCategoria(c, i){ return EXP_CAT_COR[c] || ['#E05252','#F0A500','#2DB37A','#4E8EAC','#9B6BCC','#2DC0AE','#6B7A8D','#E8739A'][i%8]; }

function cartaoCategorias(byCat, maxCat){
  const entradas = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!entradas.length) return '';
  const total = entradas.reduce((s,[,v])=>s+v, 0);
  if(total <= 0) return '';

  // ─── Gráfico de rosca (donut) em SVG ───
  const R = 42, C = 2 * Math.PI * R;   // raio e circunferência
  let offset = 0;
  const segmentos = entradas.map(([c,v], i) => {
    const frac = v / total;
    const len = frac * C;
    const cor = corCategoria(c, i);
    const seg = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${cor}" stroke-width="16"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 60 60)"></circle>`;
    offset += len;
    return seg;
  }).join('');
  const maiorCat = entradas[0];
  const maiorPct = Math.round(maiorCat[1] / total * 100);

  const donut = `<div style="display:flex;align-items:center;gap:14px;margin-top:10px">
    <svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0">
      ${segmentos}
      <text x="60" y="55" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">MAIOR</text>
      <text x="60" y="70" text-anchor="middle" font-size="15" fill="var(--text)" font-weight="900">${maiorPct}%</text>
    </svg>
    <div style="flex:1;min-width:0">
      ${entradas.map(([c,v],i)=>{
        const pct = Math.round(v/total*100);
        return `<div style="display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px">
          <span style="width:10px;height:10px;border-radius:3px;background:${corCategoria(c,i)};flex-shrink:0"></span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c)}</span>
          <b style="flex-shrink:0">${pct}%</b>
          <span style="color:var(--muted);flex-shrink:0;min-width:60px;text-align:right">${fmtBRLFin(v)}</span>
        </div>`;
      }).join('')}
    </div></div>`;
  return `<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px">
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:2px">📊 Para onde foi o dinheiro</div>
    ${donut}</div>`;
}

function fluxoBuckets(){
  const now = new Date();
  const mk = (label, months) => ({label, months});
  const ym = d => d.toISOString().slice(0,7);
  const out = [];
  if(finPeriod === 'm'){
    for(let i=0;i<12;i++){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      out.push(mk(`${MONTHS[d.getMonth()]} ${d.getFullYear()}`, [ym(d)]));
    }
  } else if(finPeriod === 't'){
    const q0 = Math.floor(now.getMonth()/3);
    for(let i=0;i<4;i++){
      const qs = new Date(now.getFullYear(), (q0-i)*3, 1);
      const ms = [0,1,2].map(k => ym(new Date(qs.getFullYear(), qs.getMonth()+k, 1)));
      out.push(mk(`${Math.floor(qs.getMonth()/3)+1}º trim. ${qs.getFullYear()}`, ms));
    }
  } else if(finPeriod === 's'){
    const s0 = now.getMonth() < 6 ? 0 : 6;
    for(let i=0;i<4;i++){
      const ss = new Date(now.getFullYear(), s0 - i*6, 1);
      const ms = [0,1,2,3,4,5].map(k => ym(new Date(ss.getFullYear(), ss.getMonth()+k, 1)));
      out.push(mk(`${ss.getMonth()<6?'1º':'2º'} sem. ${ss.getFullYear()}`, ms));
    }
  } else {
    for(let i=0;i<3;i++){
      const y = now.getFullYear()-i;
      out.push(mk(String(y), Array.from({length:12},(_,k)=>`${y}-${String(k+1).padStart(2,'0')}`)));
    }
  }
  return out;
}
function fluxoRows(){
  const all = allReceivables();
  return fluxoBuckets().map(b => {
    const inB = s => b.months.some(m => (s||'').startsWith(m));
    const receb = all.filter(r=>r.status==='pago' && inB(r.paidAt)).reduce((s,r)=>s+r.valor,0);
    const prev  = all.filter(r=>r.status==='pendente' && inB(r.due)).reduce((s,r)=>s+r.valor,0);
    const desp  = DB.expenses.filter(e=>inB(e.date)).reduce((s,e)=>s+e.valor,0);
    // ym: ano-mês para tag de contexto (só no modo mensal, onde há 1 mês por bucket)
    const ym = (finPeriod==='m' && b.months.length===1) ? b.months[0] : null;
    return {label:b.label, receb, prev, desp, saldo:receb-desp, ym};
  }).filter((r,i) => r.receb || r.prev || r.desp || i < 3);
}

// PRODUÇÃO CLÍNICA — indicadores (pedido da Linda, 9.74)
// Semana/mês/ano · Atendimentos e avulsos × Doses aplicadas · plantões
// renomeáveis (ícone fixo) · vacinas somadas por nome × separadas ·
// indicadores que o veterinário escolhe exibir · nada disso altera os
// registros originais — só como eles aparecem aqui.
// ══════════════════════════════════════════════════════════════════════
function normIndicatorKey(s){
  return String(s||'').trim().toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/^VACINA\s+/,'')
    .replace(/\s+/g,' ');
}
function indicatorIcon(rawKey){
  const s = String(rawKey||'').toLowerCase();
  // Vacinas usam o prefixo "VAC::" (nome já normalizado, sem o texto "vacina") — checa o prefixo
  // diretamente para garantir a seringa fixa em toda dose aplicada, unificada ou não.
  if(/^vac::/.test(s)) return '💉';
  if(/plant[aã]o/.test(s)) return '🌙';
  if(/vacin/.test(s)) return '💉';
  if(/retorno/.test(s)) return '🔄';
  if(/consulta/.test(s)) return '🩺';
  if(/exame/.test(s)) return '🔬';
  if(/cirurgia/.test(s)) return '🏥';
  if(/emergen/.test(s)) return '🚨';
  if(/banho/.test(s)) return '🛁';
  if(/produto/.test(s)) return '📦';
  if(/medicamento/.test(s)) return '💊';
  if(/orienta|telefone/.test(s)) return '📞';
  return '📌';
}
function finProdRange(period, refISO){
  const ref = new Date((refISO || todayISO()) + 'T12:00:00');
  let start, end;
  if(period === 'semana'){
    const day = ref.getDay(); // 0=domingo
    const seg = new Date(ref); seg.setDate(ref.getDate() + (day===0 ? -6 : 1-day));
    start = seg; end = new Date(seg); end.setDate(seg.getDate()+6);
  } else if(period === 'ano'){
    start = new Date(ref.getFullYear(),0,1); end = new Date(ref.getFullYear(),11,31);
  } else { // mes
    start = new Date(ref.getFullYear(), ref.getMonth(), 1);
    end = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
  }
  const toISO = d => d.toISOString().slice(0,10);
  return {start: toISO(start), end: toISO(end)};
}
function computeProdIndicators(){
  const period = DB.settings.finProdPeriod || 'mes';
  const {start, end} = finProdRange(period, finProdRefDate || todayISO());
  const inRange = d => !!d && d >= start && d <= end;
  const mode = DB.settings.finProdMode || 'atend'; // 'atend' | 'doses'
  const unify = !!DB.settings.finUnifyVaccines;
  const items = {}; // rawKey -> {rawKey, baseLabel, count}
  const bump = (rawKey, baseLabel) => {
    if(!items[rawKey]) items[rawKey] = {rawKey, baseLabel, count:0};
    items[rawKey].count++;
  };
  if(mode === 'atend'){
    DB.pets.forEach(p => (p.appointments||[]).forEach(a => {
      if(inRange(a.date)) bump('AT::' + (a.title||'Outros'), a.title||'Outros');
    }));
    (DB.charges||[]).forEach(c => {
      if(inRange(c.date || c.due)){
        const cat = (c.desc||'').split('·')[0].split('(')[0].trim() || 'Avulso';
        bump('CH::' + cat, cat);
      }
    });
  } else { // doses aplicadas — só doses REALMENTE aplicadas, nunca programadas
    DB.pets.forEach(p => (p.vaccines||[]).forEach(v => {
      if(v.status === 'aplicada' && inRange(v.applied)){
        if(unify) bump('VAC::__ALL__', 'Todas as doses aplicadas');
        else bump('VAC::' + normIndicatorKey(v.name), (v.name||'Vacina').trim());
      }
    }));
  }
  const hidden = new Set(DB.settings.finIndicatorsHidden || []);
  const labels = DB.settings.finIndicatorLabels || {};
  const list = Object.values(items).map(it => ({
    rawKey: it.rawKey,
    label: labels[it.rawKey] || it.baseLabel,
    icon: indicatorIcon(it.rawKey),
    count: it.count,
    hidden: hidden.has(it.rawKey),
    renomeavel: /plant[aã]o/i.test(it.rawKey)
  })).sort((a,b) => b.count - a.count);
  return {list, start, end, period, mode, unify};
}

              <b style="font-size:13px">${it.count}</b>

  return h;

function renderFluxo(){
  if(!isPro()) return `<div class="card" style="cursor:pointer" onclick="openProModal('O fluxo financeiro é um recurso Pro.')">

  // Produção clínica do período (atendimentos por tipo)

  fluxoBuckets().forEach(b => b.months.forEach(m => perMonths.add(m)));

  const ticket = pagosN ? tR / pagosN : 0;
  const taxa = (tR + tP) > 0 ? Math.round(tR / (tR + tP) * 100) : 100;

  // ─── Comparação: mês atual vs. mês anterior (recebido) ───
  const _now = new Date();
  const _mAtual = _now.toISOString().slice(0,7);

  const recebMesAtual = allRecv.filter(r => r.status==='pago' && (r.paidAt||'').startsWith(_mAtual)).reduce((s,r)=>s+r.valor,0);
  const recebMesAnt = allRecv.filter(r => r.status==='pago' && (r.paidAt||'').startsWith(_mAnt)).reduce((s,r)=>s+r.valor,0);
  let deltaPct = null, recebAnterior = recebMesAnt;
  if(recebMesAnt > 0) deltaPct = Math.round((recebMesAtual - recebMesAnt) / recebMesAnt * 100);

  // ═══ CARD RESUMO — limpo e visual ═══

    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px">📊 Resumo do período</div>

    <div style="display:flex;gap:8px;margin-bottom:12px">
