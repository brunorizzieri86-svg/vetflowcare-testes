        <div style="font-size:16px;font-weight:900;color:var(--success);margin-top:3px">${fmtBRLFin(tR)}</div></div>
      <div style="flex:1;text-align:center;padding:10px 4px;background:rgba(78,142,172,.10);border-radius:12px">
        <div style="font-size:9px;font-weight:800;color:var(--vac);text-transform:uppercase;letter-spacing:.3px">📅 A receber</div>
        <div style="font-size:16px;font-weight:900;color:var(--vac);margin-top:3px">${fmtBRLFin(tP)}</div></div>
      <div style="flex:1;text-align:center;padding:10px 4px;background:rgba(224,82,82,.10);border-radius:12px">
        <div style="font-size:9px;font-weight:800;color:var(--danger);text-transform:uppercase;letter-spacing:.3px">🧾 Despesas</div>
        <div style="font-size:16px;font-weight:900;color:var(--danger);margin-top:3px">${fmtBRLFin(tD)}</div></div>
    </div>
    <!-- Saldo em destaque -->
    <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:${tS>=0?'rgba(45,179,122,.12)':'rgba(224,82,82,.12)'};border-radius:12px">
      <span style="font-size:13px;font-weight:700;color:var(--text)">${tS>=0?'💰 Saldo do período':'⚠️ PREJUÍZO no período'}</span>
      <b style="font-size:20px;color:${tS>=0?'var(--success)':'var(--danger)'}">${fmtBRLFin(tS)}</b>
    </div>
    ${deltaPct !== null ? `<div style="text-align:center;margin-top:8px;font-size:12px">
      ${deltaPct > 0 ? `<span style="color:var(--success);font-weight:700">📈 Este mês ↑ ${deltaPct}%</span>` :
        deltaPct < 0 ? `<span style="color:var(--danger);font-weight:700">📉 Este mês ↓ ${Math.abs(deltaPct)}%</span>` :
        `<span style="color:var(--muted);font-weight:700">= igual ao mês passado</span>`}
      <span style="color:var(--muted)"> vs. mês passado (${fmtBRLFin(recebAnterior)})</span></div>` : ''}
    <!-- KPIs secundários -->
    <div style="display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border)">
      <div style="flex:1;text-align:center"><div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">Taxa recebim.</div>
        <b style="font-size:16px;color:${taxa>=80?'var(--success)':taxa>=50?'var(--warning)':'var(--danger)'}">${taxa}%</b></div>
      <div style="flex:1;text-align:center;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">Ticket médio</div>
        <b style="font-size:16px">${fmtBRLFin(ticket)}</b></div>
      <div style="flex:1;text-align:center"><div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">Atendim.</div>
        <b style="font-size:16px">${prodTot}</b></div>
    </div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn sm" onclick="printFluxo()">📄 Exportar PDF</button>
    </div></div>`;

  // ═══ META DE FATURAMENTO (se configurada) ═══
  const meta = parseFloat(DB.settings.metaMensal) || 0;
  if(meta > 0){
    const recebMes = allRecv.filter(r => r.status==='pago' && (r.paidAt||'').startsWith(_mAtual)).reduce((s,r)=>s+r.valor,0);
    const pctMeta = Math.round(recebMes / meta * 100);
    const bateu = recebMes >= meta;
    const falta = Math.max(0, meta - recebMes);
    h += `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">🎯 Meta do mês (${MONTHS[_now.getMonth()]})</span>
        <b style="font-size:13px;color:${bateu?'var(--success)':'var(--text)'}">${fmtBRLFin(recebMes)} / ${fmtBRLFin(meta)}</b></div>
      <div style="height:20px;background:var(--bg);border-radius:10px;overflow:hidden;position:relative">
        <div style="height:100%;width:${Math.min(100,pctMeta)}%;background:${bateu?'var(--success)':'var(--primary)'};border-radius:10px;transition:width .4s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px">
          ${pctMeta>=15?`<b style="font-size:11px;color:#fff">${pctMeta}%</b>`:''}</div>
        ${pctMeta<15?`<b style="font-size:11px;color:var(--muted);position:absolute;left:8px;top:50%;transform:translateY(-50%)">${pctMeta}%</b>`:''}
      </div>
      <div style="font-size:12px;text-align:center;margin-top:8px;color:${bateu?'var(--success)':'var(--muted)'};font-weight:${bateu?'700':'400'}">
        ${bateu ? '🎉 Meta batida! Parabéns!' : `Faltam ${fmtBRLFin(falta)} para bater a meta`}</div>
    </div>`;
  }

  // ═══ PRODUÇÃO CLÍNICA — indicadores escolhíveis, plantões renomeáveis e vacinas somadas ═══
  h += renderProdIndicators();

  // ═══ RECEBIDO POR FORMA DE PAGAMENTO ═══
  const porMeio = {};
  let meioTot = 0;
  allRecv.forEach(r => {
    if(r.status==='pago' && inPer(r.paidAt)){
      const m = r.meioPag || 'pix';
      porMeio[m] = (porMeio[m]||0) + r.valor;
      meioTot += r.valor;
    }
  });
  if(meioTot > 0){
    const maxM = Math.max(...Object.values(porMeio));
    // ordena do maior para o menor
    const ordenado = Object.entries(porMeio).sort((a,b)=>b[1]-a[1]);
    h += `<div class="card" style="margin-bottom:12px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px">💳 Recebido por forma de pagamento</div>
      ${ordenado.map(([m,v])=>`
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <span style="font-size:12px;min-width:120px;font-weight:600">${MEIOS_PAG[m]?.emo||'💰'} ${MEIOS_PAG[m]?.label||m}</span>
          <div style="flex:1;height:18px;background:var(--bg);border-radius:9px;position:relative;overflow:hidden">
            <div style="height:100%;width:${Math.max(14,Math.round(v/maxM*100))}%;background:var(--success);border-radius:9px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px">
              <b style="font-size:10.5px;color:#fff;white-space:nowrap">${fmtBRLFin(v)}</b></div>
          </div></div>`).join('')}
      <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:12px">
        <b style="color:var(--muted)">Total recebido</b><b style="color:var(--success)">${fmtBRLFin(meioTot)}</b></div>
    </div>`;
  }
  const maxV = Math.max(1, ...rows.map(r=>Math.max(r.receb, r.desp, r.prev)));
  const chartRows = [...rows].reverse();
  const LIM = 3;
  const mostra = window._fluxoVerMais ? chartRows : chartRows.slice(0, LIM);
  h += `<div class="card" style="margin-bottom:12px">
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px">📈 Evolução</div>
    ${mostra.map(r=>`<div style="margin-top:12px">
      <div style="font-size:12px;font-weight:700;margin-bottom:5px">${r.label}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
        <div style="flex:1;height:16px;background:var(--bg);border-radius:8px;overflow:hidden"><div style="height:100%;width:${Math.max(2,Math.round(r.receb/maxV*100))}%;background:var(--success);border-radius:8px"></div></div>
        <span style="font-size:11px;font-weight:700;color:var(--success);min-width:76px;text-align:right">${fmtBRLFin(r.receb)}</span></div>
      ${r.prev?`<div style="display:flex;align-items:center;gap:6px;margin-top:3px">
        <div style="flex:1;height:16px;background:var(--bg);border-radius:8px;overflow:hidden"><div style="height:100%;width:${Math.max(2,Math.round(r.prev/maxV*100))}%;background:var(--vac);border-radius:8px;opacity:.75"></div></div>
        <span style="font-size:11px;font-weight:700;color:var(--vac);min-width:76px;text-align:right">${fmtBRLFin(r.prev)}</span></div>`:''}
      ${r.desp?`<div style="display:flex;align-items:center;gap:6px;margin-top:3px">
        <div style="flex:1;height:16px;background:var(--bg);border-radius:8px;overflow:hidden"><div style="height:100%;width:${Math.max(2,Math.round(r.desp/maxV*100))}%;background:var(--danger);border-radius:8px;opacity:.8"></div></div>
        <span style="font-size:11px;font-weight:700;color:var(--danger);min-width:76px;text-align:right">${fmtBRLFin(r.desp)}</span></div>`:''}
    </div>`).join('')}
    ${chartRows.length > LIM ? `<div style="text-align:center;margin-top:12px">
      <button class="chip" onclick="window._fluxoVerMais=${!window._fluxoVerMais};render()">${window._fluxoVerMais?'▲ Ver menos':'▼ Ver todos os '+chartRows.length+' períodos'}</button></div>`:''}
    <div style="display:flex;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;color:var(--muted)">
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--success)"></i> Recebido</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--vac)"></i> A receber</span>
      <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--danger)"></i> Despesas</span></div>
  </div>`;

  // ═══ CARDS MENSAIS — com tags de contexto [MÊS ATUAL] [FECHADO] [FUTURO] ═══
  const nowYM = todayISO().slice(0,7);
  rows.forEach(r => {
    // determina o contexto temporal
    let tag = '', tagColor = '';
    if(r.ym){
      if(r.ym === nowYM){ tag = 'MÊS ATUAL'; tagColor = 'var(--primary)'; }
      else if(r.ym > nowYM){ tag = 'FUTURO'; tagColor = 'var(--vac)'; }
      else { tag = 'FECHADO'; tagColor = 'var(--muted)'; }
    }
    h += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:8px">
          <b style="font-size:14px">${r.label}</b>
          ${tag?`<span style="font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:20px;background:${tagColor==='var(--muted)'?'var(--bg)':'rgba(45,192,174,.12)'};color:${tagColor};text-transform:uppercase;letter-spacing:.3px">${tag}</span>`:''}
        </div>
        <b style="color:${r.saldo>=0?'var(--success)':'var(--danger)'};font-size:15px">${r.saldo>=0?'':'⚠️ '}${fmtBRLFin(r.saldo)}</b></div>
      <div style="display:flex;gap:6px;margin-top:8px;font-size:11px;flex-wrap:wrap">
        <span class="st ok">✓ Recebido ${fmtBRLFin(r.receb)}</span>
        ${r.prev?`<span class="st prog">📅 A receber ${fmtBRLFin(r.prev)}</span>`:''}
        ${r.desp?`<span class="st bad">🧾 Despesas ${fmtBRLFin(r.desp)}</span>`:''}
      </div></div>`;
  });
  return h;
}

function selMeioPagChg(btn, meio){
  btn.parentElement.querySelectorAll('.chip[data-meio]').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  const taxa = taxaDoMeio(meio);
  const info = document.getElementById('fCMeioInfo');
  if(info){
    info.innerHTML = taxa > 0
      ? `Taxa de ${taxa}% — o app calcula o valor líquido automaticamente.`
      : `Sem taxa — você recebe o valor integral.`;
  }
}

function buildChgParcelas(){
  const n = parseInt(document.getElementById('fCParc')?.value)||1;
  const total = moedaVal(document.getElementById('fCValor'))||0;
  const rows = document.getElementById('fCParcRows');
  const info = document.getElementById('fCParcInfo');
  document.getElementById('fCParc1').style.display = n===1 ? 'block' : 'none';
  if(!rows) return;
  if(n === 1){ rows.innerHTML=''; info.style.display='none'; return; }
  info.style.display = 'block';
  const base = Math.floor((total/n)*100)/100;
  let html = '';
  for(let i=0;i<n;i++){
    const v = i===n-1 ? (total - base*(n-1)).toFixed(2) : base.toFixed(2);
    const sug = fmtDate(addDays(todayISO(), 30*(i+1)));
    const oldV = document.getElementById('fCParcV'+i)?.dataset.valor;
    const oldD = document.getElementById('fCParcD'+i)?.value;
    html += `<div style="display:flex;gap:8px;align-items:flex-end;margin-top:8px">
      <div style="flex:1"><label>Parcela ${i+1}</label>
      <input id="fCParcV${i}" inputmode="numeric" placeholder="R$ 0,00" value="${moedaInit(oldV||(total?v:0))}" data-valor="${oldV||(total?v:0)}" oninput="maskMoeda(this)"></div>
      <div style="flex:1"><label>Vencimento</label>
      <input id="fCParcD${i}" placeholder="DD/MM/AAAA" inputmode="numeric" maxlength="10" value="${oldD||sug}" oninput="maskDate(this)"></div></div>`;
  }
  rows.innerHTML = html;
}
function saveCharge(editId, force){
  const desc = val('fCDesc'), valor = moedaVal(document.getElementById('fCValor'));
  if(!desc || !valor){ toast('⚠ Preencha descrição e valor'); return; }
  if(!(valor > 0 && valor < 1000000)){ toast('⚠ Valor inválido — use um número positivo'); return; }
  const status = document.querySelector('#fCPay .chip.on')?.dataset.v || 'pendente';
  const meioPagChg = document.querySelector('#fCMeio .chip.on')?.dataset.meio || 'pix';
  const petId = pickValue('fCPet');
  if(!petId){ toast('⚠ Paciente não encontrado — escolha da lista'); return; }
  const petSel = DB.pets.find(p=>p.id===petId);
  const n = (status==='pendente') ? (parseInt(document.getElementById('fCParc')?.value)||1) : 1;

  if(n > 1){
    // Parcelado: valida todas as parcelas
    const parc = [];
    let soma = 0;
    for(let i=0;i<n;i++){
      const v = moedaVal(document.getElementById('fCParcV'+i));
      const d = parseBRDate(document.getElementById('fCParcD'+i)?.value);
      if(!v || !d){ toast(`⚠ Preencha valor e data (DD/MM/AAAA) da parcela ${i+1}`); return; }
      soma += v; parc.push({v, d});
    }
    if(Math.abs(soma - valor) > 0.01){ toast(`⚠ As parcelas (${fmtBRL(soma)}) não fecham o total (${fmtBRL(valor)})`); return; }
    const past = parc.find(p => daysUntil(p.d) < 0);
    if(past && !force){
      confirmPastDate(past.d, `saveCharge('${editId||''}',1)`, 'Vencimento de uma das parcelas.');
      return;
    }
    const oldC = editId ? DB.charges.find(x=>x.id===editId) : null;
    parc.forEach((p,i) => {
      const base = {petId:petSel.id, desc:`${desc} (${i+1}/${n})`, valor:p.v, due:p.d,
        status:'pendente', paidAt:null, meioPag:meioPagChg, createdAt: oldC?.createdAt || todayISO()};
      if(i===0 && oldC) Object.assign(oldC, base);
      else DB.charges.push({id:uid(), ...base});
    });
    save(); closeSheet(); render();
    toast(`💰 Cobrança em ${n}x registrada!`);
    return;
  }

  const due = parseBRDate(val('fCDue')) || todayISO();
  const c0 = editId ? DB.charges.find(x=>x.id===editId) : null;
  const dueChanged = !c0 || c0.due !== due;
  if(status==='pendente' && dueChanged && daysUntil(due) < 0 && !force){
    confirmPastDate(due, `saveCharge('${editId||''}',1)`, 'Vencimento da cobrança.');
    return;
  }
  if(editId){
    Object.assign(c0, {petId:petSel.id, desc, valor, due, status, meioPag:meioPagChg,
      paidAt: status==='pago' ? (c0.paidAt||todayISO()) : null});
  } else {
    DB.charges.push({id:uid(), petId:petSel.id,
      desc, valor, due, status, meioPag:meioPagChg,
      paidAt: status==='pago' ? todayISO() : null, createdAt:todayISO()});
  }
  save(); closeSheet(); render(); toast(editId?'✏️ Cobrança atualizada!':'💰 Cobrança registrada!');
}

const FREE_PET_LIMIT = 5;
// ═══ TESTE GRÁTIS DE 30 DIAS (trial automático, sem código) ═══
const TRIAL_DIAS = 30;
const TRIAL_AVISO_DIAS = 5; // avisa quando faltar 5 dias ou menos

// Detecta se o app está rodando instalado pela Play Store (TWA/app) ou pelo navegador/site.
// Na Play Store, escondemos venda direta (regra do Google); no site, mostramos tudo.
function isPlayStore(){
  try{
    // TWA roda em modo standalone E com referrer android-app://
    const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
    const twaReferrer = document.referrer && document.referrer.startsWith('android-app://');
    // marca manual pra testes/força (se algum dia precisar)
    const forced = testStorage.getItem('vfc_is_playstore') === '1';
    return !!(twaReferrer || forced || (standalone && /Android/i.test(navigator.userAgent)));
  }catch(e){ return false; }
}

// Marca "este aparelho já usou o trial" em várias chaves (sobrevive a reinstalação da maioria)
const TRIAL_MARKS = ['vfc_trial_used', 'vfc_tu2', 'vfctrial'];
const TRIAL_IDB_KEY = 'vfc_trial_flag'; // marca espelhada no IndexedDB (mais resistente a limpeza)

// Grava a marca de "trial já usado" no testStorage E no IndexedDB (dupla camada).
function marcarTrialUsado(){
  try{ TRIAL_MARKS.forEach(k => testStorage.setItem(k, '1')); }catch(e){}
  // espelha no IndexedDB (sobrevive melhor a "limpar dados do site")
  try{ idbStore('mirror','readwrite', s => s.put({used:1, at:new Date().toISOString()}, TRIAL_IDB_KEY)); }catch(e){}
}

// Checagem rápida (síncrona) — só testStorage. Usada onde não dá pra esperar.
function trialJaUsado(){
  for(const k of TRIAL_MARKS){ try{ if(testStorage.getItem(k)) return true; }catch(e){} }
  return false;
}

// Checagem forte (assíncrona) — testStorage OU IndexedDB, com AUTO-CURA:
// se uma camada tem a marca e a outra não, reescreve a que faltou.
async function trialJaUsadoForte(){
  const ls = trialJaUsado();
  let idb = false;
  try{
    const v = await idbStore('mirror','readonly', s => s.get(TRIAL_IDB_KEY));
    idb = !!(v && v.used);
  }catch(e){}
  // auto-cura: se só uma camada tem, restaura a outra
  if(ls && !idb){ try{ idbStore('mirror','readwrite', s => s.put({used:1, at:new Date().toISOString()}, TRIAL_IDB_KEY)); }catch(e){} }
  if(idb && !ls){ try{ TRIAL_MARKS.forEach(k => testStorage.setItem(k,'1')); }catch(e){} }
  return ls || idb;
}

// Inicia o trial de 30 dias (chamado ao concluir o cadastro)
function iniciarTrial(){
  gcEvent('conta-criada');
  const hoje = todayISO();
  DB.trial = { active:true, startedAt:hoje, expiresAt:addDays(hoje, TRIAL_DIAS) };
  marcarTrialUsado();
  try{ save(); }catch(e){}
}

// Trial está ativo AGORA?
function trialAtivo(){
  const T = DB.trial;
  if(!T || !T.active || !T.expiresAt) return false;
  return todayISO() <= T.expiresAt;
}

// Trial já expirou (existiu mas passou do prazo)?
function trialExpirado(){
  const T = DB.trial;
  return !!(T && T.startedAt && T.expiresAt && todayISO() > T.expiresAt);
}

// Dias restantes do trial (0 se expirado/inexistente)
function trialDiasRestantes(){
  const T = DB.trial;
  if(!T || !T.expiresAt) return 0;
  const hoje = new Date(todayISO()+'T00:00:00');
  const fim = new Date(T.expiresAt+'T00:00:00');
  const dias = Math.ceil((fim - hoje) / 86400000);
  return dias > 0 ? dias : 0;
}


function isProReal(){
  const L = DB.license;
  if(!L || !L.pro) return false;
  if(L.expiresAt && todayISO() > L.expiresAt) return false;
  return true;
}
// isPro agora libera TUDO se: Pro real ativo OU trial de 30 dias ativo
function isPro(){
  if(isProReal()) return true;
  if(trialAtivo()) return true;
  return false;
}
function proExpired(){ const L = DB.license; return !!(L && L.code && L.expiresAt && todayISO() > L.expiresAt); }
function addMonths(iso, m){
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth() + m);
  return d.toISOString().slice(0,10);
}
const PRO_PLANS = {1:'1 mês', 6:'6 meses', 12:'12 meses'};
function vfcChecksum(seed, devId){
  // v9.9: código Pro VINCULADO ao aparelho — o mesmo código não ativa em outro celular.
  let h = 7;
  const s = seed + '|' + (devId||'') + 'ORGANIZACONECTACUIDA';
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 99991;
  return String(1000 + (h % 9000));
}
function myDevId(){
  // Auto-reparo: se o ID estiver vazio ou inválido (ex: iPhone que abriu antes do
  // fix), gera um agora e salva — assim a tela do Pro nunca mostra "AP-" vazio.
  if(!DB) return '';
  if(!/^[A-Z0-9]{4}$/.test(DB.devId||'')){ DB.devId = makeDevId(); try{ save(); }catch(e){} }
  return DB.devId;
}
// ── Convites da fase de testes (desligue mudando para false ao abrir ao público) ──
const BETA_GATE = false; // v9.30: trial de 30 dias substitui o convite obrigatório
function inviteChecksum(seed){
  let h = 7;
  const s = seed + 'CONVITEBETAVFC';
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 99991;
  return String(1000 + (h % 9000));
}
function inviteCheck(code){
  const m = /^VFC-([A-Z0-9]{4})-(\d{4})$/.exec((code||'').toUpperCase().trim());
  return !!m && inviteChecksum(m[1]) === m[2];
}

function checkInvite(){
  const code = document.getElementById('invCode').value;
  if(!inviteCheck(code)){

  testStorage.setItem('vfc_invite', JSON.stringify({code:code.toUpperCase().trim(), at:new Date().toISOString()}));
  gcEvent('convite-validado');
  document.getElementById('inviteGate').remove();
  if(window._inviteNext) window._inviteNext();
}

function vfcCheck(code){
  const m = /^VFC-([A-Z0-9]{4})-(\d{4})$/.exec((code||'').toUpperCase().trim());
  return !!m && vfcChecksum(m[1], myDevId()) === m[2];
}

// Retorna true (e mostra o modal) se a ação deve ser BLOQUEADA porque o trial expirou.
// Uso: no início de uma função → if(bloqueioTrial('nome do recurso')) return;
function bloqueioTrial(recurso){
  // se é Pro real ou trial ainda ativo, libera
  if(isProReal() || trialAtivo()) return false;
  // se o trial expirou (ou nunca existiu mas o cadastro já foi feito), bloqueia
  if(trialExpirado()){
    openTrialExpirado(recurso);
    return true;
  }
  return false;
}

function activatePro(){
  const code = val('proCode').toUpperCase().trim();
  if(!vfcCheck(code)){ toast('⚠ Código inválido para este aparelho — confira se ele foi gerado para o ID AP-'+myDevId()); return; }
  // Uso único por aparelho: cada renovação exige um código novo
  if(usedCodes().includes(code)){
    toast('⚠ Este código já foi utilizado neste aparelho. Solicite um novo código para renovar.');
    return;
  }
  const plan = 1; // Planos de 6/12 meses em breve
  DB.license = { pro:true, code, activatedAt:todayISO(),
    plan, expiresAt: addMonths(todayISO(), plan) };
  const used = usedCodes(); used.push(code);
  testStorage.setItem('vfc_used_codes', JSON.stringify(used));
  gcEvent('pro-ativado');
  save(); closeSheet(); render();
  toast(`✨ Pro ativado por ${PRO_PLANS[plan]}! Válido até ${fmtDate(DB.license.expiresAt)}`);
}

function allEvents(){
  const evts = [];
  for(const pet of DB.pets){
    if(pet.deceased) continue;
    const base = {petId:pet.id, pet:pet.name, emo:petEmoji(pet)};
    pet.vaccines.filter(v => v.status !== 'aplicada').forEach(v => {
      const d = daysUntil(v.due);
      evts.push({...base, id:'v-'+v.id, type:'vaccine', title:v.name, due:v.due, daysLeft:d, priority:priorityOf(d)});
    });
    pet.appointments.filter(a => !a.done).forEach(a => {
      const d = daysUntil(a.date);
      evts.push({...base, id:'a-'+a.id, type:'vet', title:a.title, due:a.date, daysLeft:d, priority:priorityOf(d)});
    });
  }
  // Pagamentos pendentes
  allReceivables().filter(r => r.status === 'pendente' && r.due).forEach(r => {
    const d = daysUntil(r.due);
    evts.push({petId:r.petId, pet:r.petName, emo:r.emo, id:'pay-'+r.id, type:'pay',
      title:`${fmtBRL(r.valor)} — ${r.desc}`, due:r.due, daysLeft:d, priority:priorityOf(d)});
  });
  return evts.sort((a,b)=>a.daysLeft-b.daysLeft);
}
const overdueEvents = () => allEvents().filter(e => e.priority==='overdue');

  if(sipe && !/^[A-Za-z0-9\/\-\s]{4,30}$/.test(sipe)){ toast('⚠ SIPEAGRO/MAPA inválido — ex: MV00409372021'); return false; }
  return true;
}

// contador compacto para muitos passos

function openTutorial(step = 0){
  step = Math.min(step, TUT_STEPS.length - 1);
  testStorage.setItem('vfc_tut_step', step);
  const s = TUT_STEPS[step];
  const last = step === TUT_STEPS.length - 1;
  const dots = TUT_STEPS.map((_,i)=>
    `<span style="width:8px;height:8px;border-radius:50%;display:inline-block;margin:0 3px;background:${i===step?'var(--primary)':'var(--border)'}"></span>`).join('');
  showSheet(`${s.emo} ${s.title}`, `
    <div style="font-size:14px;line-height:1.7;color:var(--text)">${s.body}</div>
    ${s.action?`<button class="btn" style="margin-top:14px" onclick="${s.action.fn}">${s.action.label}</button>`:''}
    <div style="text-align:center;margin-top:16px">${dots}</div>
    <div style="text-align:center;color:var(--muted);font-size:11px;margin-top:6px">${step+1} de ${TUT_STEPS.length}</div>`,
    `${step>0?`<button class="btn gray" onclick="openTutorial(${step-1})">‹ Anterior</button>`:`<button class="btn gray" onclick="finishTutorial()">Pular</button>`}
     <button class="btn" onclick="${last?'finishTutorial()':`openTutorial(${step+1})`}">${last?'✓ Começar!':'Próximo ›'}</button>`);
}
function finishTutorial(skipNext){
  testStorage.setItem('vfc_tut_done','1');
  testStorage.setItem('vfc_seen_ver', APP_VER);
  testStorage.removeItem('vfc_tut_step');
  closeSheet();
  if(!skipNext && !DB.vet.name) setTimeout(openVetSetup, 300);
}

function executarBusca(q){
  const el = document.getElementById('buscaResultados');
  if(!el) return;
  const term = q.trim().toLowerCase();

  // Agrupa resultados por categoria
  const secPets=[],secTuts=[],secAppts=[],secVacs=[];

  DB.pets.forEach(pet=>{
    const tut = DB.tutors?.find(t=>t.id===pet.tutorId);
    const tutNome = tut?.name||'';
    const match = !term ||
      pet.name.toLowerCase().includes(term) ||
      (pet.species||'').toLowerCase().includes(term) ||
      (pet.breed||'').toLowerCase().includes(term) ||
      tutNome.toLowerCase().includes(term) ||
      (pet.microchip||'').includes(term);

    if(match) secPets.push({pet,tut});

    (pet.appointments||[]).forEach(a=>{
      if(!term || a.title?.toLowerCase().includes(term) || (a.record||'').toLowerCase().includes(term) || (a.resumo||'').toLowerCase().includes(term)){
        secAppts.push({a,pet});
      }
    });

    (pet.vaccines||[]).forEach(v=>{
      if(!term || v.name?.toLowerCase().includes(term)){
        secVacs.push({v,pet});
      }
    });
  });

  (DB.tutors||[]).forEach(t=>{
    if(!term || t.name?.toLowerCase().includes(term) || (t.phone||'').includes(term) || (t.email||'').toLowerCase().includes(term)){
      if(!secPets.some(r=>r.tut?.id===t.id)) secTuts.push({t});
    }
  });

  if(!term){
    el.innerHTML = `<div style="text-align:center;color:rgba(255,255,255,.35);padding:40px 0;font-size:14px">Digite para buscar em todos os dados do app</div>`;
    return;
  }

  const total = secPets.length+secTuts.length+secAppts.length+secVacs.length;
  if(!total){
    el.innerHTML = `<div style="text-align:center;color:rgba(255,255,255,.35);padding:40px 0;font-size:14px">Nenhum resultado para "<b style="color:#fff">${esc(q)}</b>"</div>`;
    return;
  }

  let html='';

  const hl = txt => {
    if(!term||!txt) return esc(txt||'');
    return esc(txt).replace(new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark style="background:#2DC0AE33;color:#2DC0AE;border-radius:3px;padding:0 2px">${m}</mark>`);
  };

  if(secPets.length){
    html += `<div style="font-size:10px;letter-spacing:2px;color:#2DC0AE;font-weight:800;margin:8px 0 8px">🐾 PACIENTES (${secPets.length})</div>`;
    html += secPets.slice(0,8).map(({pet,tut})=>`
      <div onclick="document.getElementById('buscaOverlay')?.remove();openPet('${pet.id}')"
        style="background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid rgba(255,255,255,.1)">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:26px">${petEmoji(pet)}</div>
          <div style="flex:1">
            <div style="font-weight:800;color:#fff;font-size:14px">${hl(pet.name)}</div>
            <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px">${hl(pet.species||'')}${pet.breed?' · '+hl(pet.breed):''}${tut?' · '+hl(tut.name):''}</div>
          </div>
          <div style="color:rgba(255,255,255,.3);font-size:18px">›</div>
        </div>
      </div>`).join('');
  }

  if(secTuts.length){
    html += `<div style="font-size:10px;letter-spacing:2px;color:#60A5FA;font-weight:800;margin:12px 0 8px">👤 TUTORES (${secTuts.length})</div>`;
    html += secTuts.slice(0,5).map(({t})=>`
      <div onclick="document.getElementById('buscaOverlay')?.remove();openTutor('${t.id}')"
        style="background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid rgba(255,255,255,.1)">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:24px">👤</div>
          <div style="flex:1">
            <div style="font-weight:800;color:#fff;font-size:14px">${hl(t.name)}</div>
            <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px">${t.phone?'📞 '+hl(t.phone):''}${t.email?' · '+hl(t.email):''}</div>
          </div>
          <div style="color:rgba(255,255,255,.3);font-size:18px">›</div>
        </div>
      </div>`).join('');
  }

  if(secAppts.length){
    html += `<div style="font-size:10px;letter-spacing:2px;color:#F59E0B;font-weight:800;margin:12px 0 8px">📋 ATENDIMENTOS (${Math.min(secAppts.length,6)})</div>`;
    html += secAppts.slice(0,6).map(({a,pet})=>{
      const d = a.date?a.date.split('-').reverse().join('/'):'';
      return `<div onclick="document.getElementById('buscaOverlay')?.remove();openPet('${pet.id}');setTimeout(()=>{currentPetTab='records'},200)"
        style="background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid rgba(255,255,255,.1)">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:22px">${petEmoji(pet)}</div>
          <div style="flex:1">
            <div style="font-weight:800;color:#fff;font-size:13px">${hl(a.title||'Atendimento')}</div>
            <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px">${hl(pet.name)} · ${d}${a.done?` · <span style="color:#22C55E">✓ Concluído</span>`:''}</div>
            ${a.record?`<div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${hl(a.record.slice(0,80))}</div>`:''}
          </div>
          <div style="color:rgba(255,255,255,.3);font-size:18px">›</div>
        </div>
      </div>`;
    }).join('');
  }

  if(secVacs.length){
    html += `<div style="font-size:10px;letter-spacing:2px;color:#A78BFA;font-weight:800;margin:12px 0 8px">💉 VACINAS (${Math.min(secVacs.length,5)})</div>`;
    html += secVacs.slice(0,5).map(({v,pet})=>{
      const ap = v.applied?v.applied.split('-').reverse().join('/'):'—';
      return `<div onclick="document.getElementById('buscaOverlay')?.remove();openPet('${pet.id}');setTimeout(()=>{currentPetTab='vaccines'},200)"
        style="background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid rgba(255,255,255,.1)">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:22px">${petEmoji(pet)}</div>
          <div style="flex:1">
            <div style="font-weight:800;color:#fff;font-size:13px">${hl(v.name)}</div>
            <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px">${hl(pet.name)} · Aplicada: ${ap}</div>
          </div>
          <div style="color:rgba(255,255,255,.3);font-size:18px">›</div>
        </div>
      </div>`;
    }).join('');
  }

  el.innerHTML = html;
}
function goTab(tab){
  currentTab = tab; currentPetId = null; currentTutorId = null; showFinance = false;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  render();
}
function openPet(id){ currentPetId = id; currentTutorId = null; showFinance = false; currentPetTab = 'info'; render(); }
function openTutor(id){ currentTutorId = id; currentPetId = null; tutorTab = 'resp'; render(); }

function render(){
  const hdr = document.getElementById('appHeader');
  const hero = document.getElementById('petHero');
  const main = document.getElementById('mainContent');
  updateBadge();

  if(currentPetId){
    const pet = DB.pets.find(p=>p.id===currentPetId);
    if(!pet){ currentPetId=null; return render(); }
    hdr.classList.add('hidden'); hero.classList.remove('hidden');
    renderPetHero(pet); main.innerHTML = renderPetTab(pet);
    if(currentPetTab==='info') drawWeightChart(pet);
    return;
  }
  hero.classList.add('hidden');
  if(showFinance){
    hdr.classList.add('hidden');
    main.innerHTML = renderFinance();
    return;
  }
  if(currentTutorId){
    hdr.classList.add('hidden');
    main.innerHTML = renderTutorProfile();
    return;
  }
  if(currentTab==='home'){ hdr.classList.remove('hidden'); renderScorecard(); main.innerHTML = renderHome(); }
  else { hdr.classList.add('hidden'); }
  if(currentTab==='pets')     main.innerHTML = renderPetsList();
  if(currentTab==='calendar') main.innerHTML = renderCalendar();
  if(currentTab==='alerts')   main.innerHTML = renderAlerts('all');
  if(currentTab==='settings') main.innerHTML = renderSettings();
}
function updateBadge(){
  const n = overdueEvents().length;

}

// Excluir atendimento direto da agenda (com confirmação)
function delApptAgenda(petId, aid){
  const pet = DB.pets.find(p=>p.id===petId);
  const a = pet && pet.appointments.find(x=>x.id===aid);
  if(!a) return;
  vfcConfirm({
    icon: '🗑️',
    title: 'Excluir atendimento?',
    msg: `Deseja excluir <b>${esc(a.title)}</b> de <b>${esc(pet.name)}</b> em ${fmtDate(a.date)}?`,
    note: 'Esta ação não pode ser desfeita.',
    yesLabel: '🗑 Excluir', yesBg: 'var(--danger)',
    yes: `doDelApptAgenda('${petId}','${aid}')`
  });
}
function doDelApptAgenda(petId, aid){
  const pet = DB.pets.find(p=>p.id===petId);
  if(!pet) return;
  pet.appointments = pet.appointments.filter(x=>x.id!==aid);
  save(); render(); toast('Atendimento excluído');
}

  h += `<div class="card" style="display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:16px;padding:13px 16px" onclick="goFinance()">
    <span style="font-size:19px">💰</span>
    <b style="flex:1;font-size:14px">Financeiro</b>
    ${_recLate?'<span style="width:9px;height:9px;border-radius:50%;background:var(--danger)"></span>':''}
    <span style="color:var(--muted)">›</span></div>`;

  h += `<div class="sec"><div class="sec-h"><span>Pacientes</span>
    <button onclick="goTab('pets')">Ver todos →</button></div>
    <div style="display:flex;gap:10px;align-items:stretch">
      <div class="pet-add" style="flex-shrink:0;margin:0" onclick="openPetForm()"><div class="plus">+</div>Novo Paciente</div>
      <div class="pets-row" style="flex:1;min-width:0;margin:0">`;
  pets.forEach(p => {
    const s = healthScore(p), c = petColor(p);
    h += `<div class="pet-card" style="border-color:${c}40;background:color-mix(in srgb, ${c} 8%, var(--surface))" onclick="openPet('${p.id}')">
      <div class="emo">${p.photo?`<img src="${p.photo}" style="width:44px;height:44px;border-radius:50%;object-fit:cover">`:petEmoji(p)}</div>
      <div class="nm">${esc(p.name)}</div><div class="br">${esc(p.breed||p.species)}</div>
      ${ringSVG(s,46,false)}<div class="sl">saúde</div></div>`;
  });
  h += `</div></div></div>`;

  h += `<div class="sec"><div class="sec-h"><span>📅 Próximos 7 dias</span></div>`;
  h += week.length ? week.map(evtRow).join('') :
    `<div class="card empty"><div class="big">✅</div>Nenhum evento pendente esta semana!</div>`;
  h += `</div>`;

  if(od.length) h += `<div class="sec"><div class="sec-h"><span>⚠️ Ação Necessária</span></div>${od.map(evtRow).join('')}</div>`;

  // 🐾 FIQUE POR DENTRO — divulgação do site + Instagram (novidades, dicas e parcerias)
  h += cardComunidade();
  return h;
}

async function uploadTutorFicha(tid, input){
  const file = input.files[0]; if(!file) return;
  if(file.size > 20_000_000){ toast('⚠ Arquivo muito grande (máx 20MB)'); return; }
  const r = new FileReader();
  r.onload = async e => {
    const id = uid();
    try{
      await idbPut(id, e.target.result);
      const t = DB.tutors.find(x=>x.id===tid);
      if(t.ficha) idbDel(t.ficha.id);
      t.ficha = {id, name:file.name, date:todayISO(), kind: file.type==='application/pdf'?'pdf':'img'};
      save(); render(); toast('📎 Ficha anexada!');
    }catch(err){ toast('⚠ Erro ao salvar'); }
  };
  r.readAsDataURL(file);
}
async function viewTutorFicha(tid){
  const t = DB.tutors.find(x=>x.id===tid);
  if(!t?.ficha) return;
  const data = t.ficha.data || await idbGet(t.ficha.id);
  if(!data){ toast('⚠ Arquivo não encontrado'); return; }
  if(t.ficha.kind === 'pdf'){
    const b64 = data.split(',')[1], bytes = atob(b64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([arr], {type:'application/pdf'}));
    a.download = t.ficha.name; a.click();
    toast('📄 PDF baixado');
    return;
  }
  const w = window.open('');
  if(!w){ toast('⚠ Permita pop-ups'); return; }
  w.document.write(`<title>${esc(t.ficha.name)}</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${data}" style="max-width:100%;max-height:100vh"><div style="position:fixed;right:0;bottom:0;z-index:10001;background:#ffedb5;color:#665328;font:9px Arial;padding:3px 6px;pointer-events:none">TESTES · DADOS SEPARADOS</div></body>`);
}

async function buscaCEP(cep){
  const c = cep.replace(/\D/g,'');
  if(c.length !== 8) return;
  try{
    toast('🔎 Buscando endereço…');
    const r = await fetch(`https://viacep.com.br/ws/${c}/json/`);
    const d = await r.json();
    if(d.erro){ toast('⚠ CEP não encontrado'); return; }
    const addr = document.getElementById('tAddr');
    const bai = document.getElementById('tBairro');
    if(bai && !bai.value.trim() && d.bairro) bai.value = d.bairro;
    if(addr && !addr.value.trim()){
      addr.value = `${d.logradouro||''}${d.localidade?' — '+d.localidade:''}${d.uf?'/'+d.uf:''}`.replace(/^ — /,'');
      toast('✅ Endereço preenchido — adicione o número');
      addr.focus();
    }
  }catch(e){ /* offline: segue manual */ }
}
function saveTutorForm(tutorId){
  const name = val('tName');
  if(!name){ toast('⚠ Informe o nome do tutor'); return; }
  const fields = { name, cpf:val('tCpf'), phone:val('tPhone'),
    cep:val('tCep'), bairro:val('tBairro'), address:val('tAddr'), email:val('tEmail') };
  if(tutorId){
    Object.assign(DB.tutors.find(x=>x.id===tutorId), fields);
  } else {
    const t = normalizeTutor(fields);
    DB.tutors.push(t);
    if(window._linkPet){
      const p = DB.pets.find(x=>x.id===window._linkPet);
      if(p) p.tutorId = t.id;
      window._linkPet = null;
    } else {
      currentTutorId = t.id; tutorTab = 'animais';
    }
  }
  if(!tutorId) gcEvent('tutor-criado');
  save(); closeSheet(); render(); toast(tutorId?'✏️ Tutor atualizado!':'👤 Tutor cadastrado!');
}
function delTutor(id){
  const t = DB.tutors.find(x=>x.id===id);

function drawWeightChart(pet){
  const cv = document.getElementById('weightChart');
  if(!cv || pet.weightHistory.length<2) return;
  const ctx = cv.getContext('2d');
  const W = cv.parentElement.clientWidth - 26, H = 150;
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  cv.style.height = H+'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const data = pet.weightHistory.slice(-12);
  const kgs = data.map(d=>d.kg);
  const min = Math.min(...kgs)*0.96, max = Math.max(...kgs)*1.04;
  const px = i => 30 + (i/(data.length-1))*(W-45);
  const py = v => 12 + (1-(v-min)/(max-min||1))*(H-40);
  const c = petColor(pet);
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--border'); ctx.lineWidth = .5;
  for(let i=0;i<4;i++){ const y = 12+i*(H-40)/3; ctx.beginPath();ctx.moveTo(28,y);ctx.lineTo(W-10,y);ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--muted'); ctx.font='9px sans-serif';
    ctx.fillText((max-(i*(max-min)/3)).toFixed(1), 0, y+3); }
  ctx.beginPath(); ctx.moveTo(px(0), H-24);
  data.forEach((d,i)=>ctx.lineTo(px(i), py(d.kg)));
  ctx.lineTo(px(data.length-1), H-24); ctx.closePath();
  ctx.fillStyle = c+'22'; ctx.fill();
  ctx.beginPath(); data.forEach((d,i)=> i?ctx.lineTo(px(i),py(d.kg)):ctx.moveTo(px(i),py(d.kg)));
  ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke();
  data.forEach((d,i)=>{
    ctx.beginPath(); ctx.arc(px(i),py(d.kg),4,0,7); ctx.fillStyle=c; ctx.fill();
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--muted'); ctx.font='9px sans-serif';
    const [y2,m2] = d.date.split('-');
    ctx.fillText(`${m2}/${y2.slice(2)}`, px(i)-10, H-10);
  });
}

// Foto do selo da ampola por dose aplicada — com recorte/ajuste antes de salvar
function fotografarSelo(petId, vacId, modo){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  if(modo !== 'gallery') inp.capture = 'environment';
  inp.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => abrirRecorteSelo(ev.target.result, petId, vacId);
    reader.readAsDataURL(file);
  };
  inp.click();
}

// Abre a tela de recorte: o vet arrasta a caixa sobre o selo e ajusta
function abrirRecorteSelo(dataUrl, petId, vacId){
  showSheet('✂️ Ajustar o selo', `
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px;text-align:center">
      Arraste a caixa sobre o <b>selo da ampola</b> e ajuste pelos cantos. Sobra só o que estiver dentro. 🏷️</div>

      <div id="cropBox" style="position:absolute;border:2px solid var(--primary);box-shadow:0 0 0 9999px rgba(15,27,46,.55);border-radius:6px;cursor:move;touch-action:none">
        <div class="cropH" data-h="nw" style="position:absolute;top:-9px;left:-9px;width:20px;height:20px;background:var(--primary);border:2px solid #fff;border-radius:50%;touch-action:none"></div>
        <div class="cropH" data-h="ne" style="position:absolute;top:-9px;right:-9px;width:20px;height:20px;background:var(--primary);border:2px solid #fff;border-radius:50%;touch-action:none"></div>
        <div class="cropH" data-h="sw" style="position:absolute;bottom:-9px;left:-9px;width:20px;height:20px;background:var(--primary);border:2px solid #fff;border-radius:50%;touch-action:none"></div>
        <div class="cropH" data-h="se" style="position:absolute;bottom:-9px;right:-9px;width:20px;height:20px;background:var(--primary);border:2px solid #fff;border-radius:50%;touch-action:none"></div>
      </div>
    </div>`,
    `<div style="display:flex;gap:8px">
      <button class="btn gray" style="flex:1" onclick="closeSheet()">Cancelar</button>
      <button class="btn" style="flex:1.4" onclick="aplicarRecorteSelo('${petId}','${vacId}')">✂️ Recortar e salvar</button>

function initCropBox(){
  const wrap = document.getElementById('cropWrap');
  const box = document.getElementById('cropBox');
  if(!wrap || !box) return;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  // caixa inicial: centralizada, ~70% largura, proporção de selo (mais larga que alta)
  let bw = W*0.7, bh = Math.min(H*0.6, bw*0.62);
  let bx = (W-bw)/2, by = (H-bh)/2;
  const apply = () => { box.style.left=bx+'px'; box.style.top=by+'px'; box.style.width=bw+'px'; box.style.height=bh+'px'; };
  apply();

  let mode=null, sx=0, sy=0, ox=0, oy=0, ow=0, oh=0;
  const pt = e => { const t = e.touches ? e.touches[0] : e; return {x:t.clientX, y:t.clientY}; };

  const start = (e, m) => {
    e.preventDefault(); e.stopPropagation();
    mode = m; const p = pt(e); sx=p.x; sy=p.y; ox=bx; oy=by; ow=bw; oh=bh;
    document.addEventListener('mousemove', move); document.addEventListener('touchmove', move, {passive:false});
    document.addEventListener('mouseup', end); document.addEventListener('touchend', end);
  };
  const move = e => {
    if(!mode) return; e.preventDefault();
    const p = pt(e); const dx = p.x - sx, dy = p.y - sy;
    const MIN = 40;
    if(mode==='move'){
      bx = Math.max(0, Math.min(W-bw, ox+dx));
      by = Math.max(0, Math.min(H-bh, oy+dy));
    } else {
      // redimensiona pelos cantos
      if(mode.includes('e')) bw = Math.max(MIN, Math.min(W-ox, ow+dx));
      if(mode.includes('s')) bh = Math.max(MIN, Math.min(H-oy, oh+dy));
      if(mode.includes('w')){ const nw = Math.max(MIN, Math.min(ox+ow, ow-dx)); bx = ox+ow-nw; bw = nw; }
      if(mode.includes('n')){ const nh = Math.max(MIN, Math.min(oy+oh, oh-dy)); by = oy+oh-nh; bh = nh; }
    }
    apply();
  };
  const end = () => {
    mode=null;
    document.removeEventListener('mousemove', move); document.removeEventListener('touchmove', move);
    document.removeEventListener('mouseup', end); document.removeEventListener('touchend', end);
  };

  box.addEventListener('mousedown', e => { if(e.target===box) start(e,'move'); });
  box.addEventListener('touchstart', e => { if(e.target===box) start(e,'move'); }, {passive:false});
  box.querySelectorAll('.cropH').forEach(hd => {
    hd.addEventListener('mousedown', e => start(e, hd.dataset.h));
    hd.addEventListener('touchstart', e => start(e, hd.dataset.h), {passive:false});
  });
}

function aplicarRecorteSelo(petId, vacId){
  const wrap = document.getElementById('cropWrap');
  const img = document.getElementById('cropImg');
  const box = document.getElementById('cropBox');
  if(!wrap || !img || !box){ closeSheet(); return; }
  // proporção entre a imagem exibida e a real
  const escalaReal = img.naturalWidth / img.clientWidth;
  const cropX = box.offsetLeft * escalaReal;
  const cropY = box.offsetTop * escalaReal;
  const cropW = box.offsetWidth * escalaReal;
  const cropH = box.offsetHeight * escalaReal;
  // saída com no máximo 320px de largura (leve, mas legível)
  const escalaOut = Math.min(1, 320/cropW);
  const cv = document.createElement('canvas');
  cv.width = Math.round(cropW*escalaOut);
  cv.height = Math.round(cropH*escalaOut);
  cv.getContext('2d').drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cv.width, cv.height);
  const pet = DB.pets.find(p=>p.id===petId);
  const v = pet && pet.vaccines.find(x=>x.id===vacId);
  if(v){ v.selo = cv.toDataURL('image/jpeg',.72); save(); closeSheet(); render(); toast('📷 Selo recortado e salvo!'); }
  else closeSheet();
}

      </div>
    </div></div>`;

  // bloco do tutor completo
  const tf = (label, valor) => valor ? `<div style="min-width:180px;flex:1"><span style="font-size:10px;color:#6B7A8D;display:block;font-weight:700;letter-spacing:.03em">${label}</span><span style="font-size:14px;color:#1A2F5A">${valor}</span></div>` : '';

    <div style="font-size:12px;font-weight:800;color:#2DC0AE;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">👤 Dados do tutor</div>
    <div style="margin-bottom:10px"><span style="font-size:10px;color:#6B7A8D;display:block;font-weight:700;letter-spacing:.03em">NOME COMPLETO</span><span style="font-size:17px;color:#1E3A6E;font-weight:700">${esc(t.name||'—')}</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:12px 28px">
      ${tf('CPF', t.cpf?fmtCPF(t.cpf):'')}
      ${tf('TELEFONE', t.phone?fmtPhone(t.phone):'')}
      ${tf('ENDEREÇO', t.address?esc(t.address)+(t.bairro?' · '+esc(t.bairro):''):'')}
      ${tf('CEP', t.cep?fmtCEP(t.cep):'')}
      ${tf('MICROCHIP', pet.chip?esc(pet.chip):'')}
    </div></div>` : '';

  // uma linha de vacina aplicada, com selo se houver
  const vacLinha = d => `<div style="display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1.5px solid #eef4f2">
    <div style="width:44px;height:44px;border-radius:11px;background:#e6f7f0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">💉</div>

      <div style="font-size:16px;font-weight:700;color:#1A2F5A">${esc(d.name)}</div>

    </div>
    ${d.selo?`<img src="${d.selo}" style="width:80px;height:auto;max-height:60px;object-fit:contain;border-radius:7px;border:1.5px solid #d5ebe9;flex-shrink:0">`:''}

  </div>`;

  const proxLinha = d => `<div style="display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1.5px solid #eef4f2">
    <div style="width:44px;height:44px;border-radius:11px;background:#fef4e0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🗓️</div>
    <div style="flex:1"><div style="font-size:16px;font-weight:700;color:#1A2F5A">${esc(d.name)}</div>
      <div style="font-size:12px;color:#6B7A8D;margin-top:2px">Prevista para ${fmtDate(d.due)}</div></div>
    <span style="font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;background:#fef4e0;color:#a67300;white-space:nowrap">Agendada</span>
  </div>`;

  // paginação: quebra as vacinas aplicadas em blocos
  const paginasVac = [];
  for(let i=0;i<aplicadas.length;i+=VAC_POR_PAGINA){
    paginasVac.push(aplicadas.slice(i, i+VAC_POR_PAGINA));
  }
  if(!paginasVac.length) paginasVac.push([]);

  const secTitle = txt => `<div style="font-size:15px;font-weight:800;color:#4E8EAC;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px">${txt}</div>`;

  // anotações (só se houver)
  const notaBox = (pet.notaCarteirinha||'').trim() ? `<div style="background:#fffdf5;border:1.5px solid #f0e6c0;border-radius:12px;padding:14px 18px;margin-top:18px">

    <div style="font-size:14px;color:#5a4a12;line-height:1.6;white-space:pre-wrap">${esc(pet.notaCarteirinha)}</div></div>` : '';

  // rodapé elegante do veterinário + sistema
  const rodapeVet = `<div style="margin-top:26px;padding-top:18px;border-top:2px solid #e3edeb">

        ${v.sipeagro?`<div style="font-size:11px;color:#6B7A8D;margin-top:1px">SIPEAGRO/MAPA: ${esc(v.sipeagro)}</div>`:''}
      </div>
    </div></div>`;

  // monta cada página
  const totalPag = paginasVac.length;
  let inner = '';
  paginasVac.forEach((bloco, idx) => {
    const primeira = idx === 0;
    const ultima = idx === totalPag - 1;
    if(idx > 0) inner += '<div style="page-break-before:always"></div>';

    if(primeira){
      inner += topo + tutorBox;
    } else {
      // cabeçalho compacto nas páginas seguintes
      inner += `<div style="background:linear-gradient(135deg,#1E3A6E,#12294f 60%,#2DC0AE);color:#fff;padding:14px 22px;border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:14px">
        <div style="font-size:26px">${petEmoji(pet)}</div>
        <div><div style="font-size:20px;font-weight:800">${esc(pet.name)}</div>
        <div style="font-size:12px;opacity:.85">Continuação · Carteirinha de Vacinação</div></div></div>`;
    }

    inner += secTitle(primeira ? '✅ Vacinas aplicadas' : '✅ Vacinas aplicadas (continuação)');
    inner += bloco.length ? bloco.map(vacLinha).join('') : '<div style="font-size:13px;color:#9aa8b6;font-style:italic;padding:8px 0">Nenhuma vacina aplicada registrada</div>';

    // próximas doses e anotações só na última página
    if(ultima){
      if(proximas.length){ inner += secTitle('📅 Próximas doses') + proximas.map(proxLinha).join(''); }
      inner += notaBox;
      inner += rodapeVet;
    }
  });

  closeSheet();
  toast('💳 Gerando carteirinha…');
  setTimeout(() => printShell('Carteirinha de Vacinação — ' + pet.name, inner), 300);
}

    </div>`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button>
     <button class="btn" id="btnAssinOk" onclick="confirmarAssin()" disabled style="opacity:.4">✓ Confirmar</button>`);
  setTimeout(iniciarAssinPad, 60);
}

function iniciarAssinPad(){
  const pad = document.getElementById('assinPad');
  _assinCanvas = document.getElementById('assinCanvas');
  if(!pad || !_assinCanvas) return;
  const r = pad.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  _assinCanvas.width = r.width * dpr;
  _assinCanvas.height = r.height * dpr;
  _assinCtx = _assinCanvas.getContext('2d');
  _assinCtx.scale(dpr, dpr);
  _assinCtx.lineWidth = 2.5;
  _assinCtx.lineCap = 'round';
  _assinCtx.lineJoin = 'round';
  _assinCtx.strokeStyle = '#12294f';
  let desenhando = false, ult = null;
  const hint = document.getElementById('assinHint');
  const pos = e => {
    const rr = _assinCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - rr.left, y: p.clientY - rr.top};
  };
  const start = e => {
    e.preventDefault(); desenhando = true; ult = pos(e);
    if(!_assinTem){ _assinTem = true; if(hint) hint.style.opacity = '0';
      const b = document.getElementById('btnAssinOk'); if(b){ b.disabled = false; b.style.opacity = '1'; } }
  };
  const move = e => {
    if(!desenhando) return; e.preventDefault();
    const p = pos(e);
    _assinCtx.beginPath(); _assinCtx.moveTo(ult.x, ult.y); _assinCtx.lineTo(p.x, p.y); _assinCtx.stroke();
    ult = p;
  };
  const end = () => { desenhando = false; };
  _assinCanvas.addEventListener('mousedown', start);
  _assinCanvas.addEventListener('mousemove', move);
  _assinCanvas.addEventListener('mouseup', end);
  _assinCanvas.addEventListener('mouseleave', end);
  _assinCanvas.addEventListener('touchstart', start, {passive:false});
  _assinCanvas.addEventListener('touchmove', move, {passive:false});
  _assinCanvas.addEventListener('touchend', end);
}

function limparAssin(){
  if(_assinCtx && _assinCanvas){ _assinCtx.clearRect(0,0,_assinCanvas.width,_assinCanvas.height); }
  _assinTem = false;
  const hint = document.getElementById('assinHint'); if(hint) hint.style.opacity = '1';
  const b = document.getElementById('btnAssinOk'); if(b){ b.disabled = true; b.style.opacity = '.4'; }
}

// Reduz a imagem da assinatura para não pesar no armazenamento (máx ~600px de largura)
function assinaturaComprimida(){
  if(!_assinCanvas) return null;
  const larguraMax = 600;
  const escala = Math.min(1, larguraMax / _assinCanvas.width);
  const tmp = document.createElement('canvas');
  tmp.width = Math.round(_assinCanvas.width * escala);
  tmp.height = Math.round(_assinCanvas.height * escala);
  const c = tmp.getContext('2d');
  c.drawImage(_assinCanvas, 0, 0, tmp.width, tmp.height);
  return tmp.toDataURL('image/png');
}

function confirmarAssin(){
  if(!_assinTem){ toast('⚠ Assine antes de confirmar'); return; }
  const img = assinaturaComprimida();

}

// Bloco de assinatura do responsável. Se houver assinatura capturada na tela,
// injeta a imagem acima da linha, com data/hora. Senão, deixa a linha em branco
// para assinatura manual (comportamento antigo preservado).
// Gera um código de verificação (hash) a partir do conteúdo do documento.
// Prova de integridade: se o documento for alterado depois de assinado, o
// código muda. Gerado 100% no aparelho, offline. Formato XXXX-XXXX-XXXX.
function hashDocumento(texto){
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for(let i=0;i<texto.length;i++){
    const c = texto.charCodeAt(i);
    h1 = (h1 ^ c) * 0x01000193 >>> 0;
    h2 = ((h2 << 5) + h2 + c) >>> 0;
  }
  const hex = (h1.toString(16).toUpperCase().padStart(8,'0') + h2.toString(16).toUpperCase().padStart(8,'0'));
  return hex.slice(0,4) + '-' + hex.slice(4,8) + '-' + hex.slice(8,12);
}

// Levanta os anos que têm algum registro clínico, do mais recente ao mais antigo.
function anosComRegistro(){
  const anos = {};
  DB.pets.forEach(p => {
    (p.appointments||[]).forEach(a => { const y=(a.date||'').slice(0,4); if(y) anos[y]=(anos[y]||0)+1; });
    (p.prescriptions||[]).forEach(r => { const y=(r.date||'').slice(0,4); if(y) anos[y]=(anos[y]||0)+1; });
  });
  return Object.keys(anos).sort((a,b)=>b.localeCompare(a)).map(y => ({ano:y, total:anos[y]}));
}

  const ids = new Set();
  DB.pets.forEach(p => {
    const teve = (p.appointments||[]).some(a=>(a.date||'').startsWith(ano)) ||
                 (p.prescriptions||[]).some(r=>(r.date||'').startsWith(ano));
    if(teve) ids.add(p.id);
  });
  return ids.size;
}

function gerarArquivoMorto(ano){
  // Reúne, por paciente, tudo o que aconteceu no ano
  const blocos = [];
  let totAtend = 0, totRx = 0, totPac = 0;
  const indice = [];

  DB.pets.forEach(pet => {
    const atends = (pet.appointments||[]).filter(a => (a.date||'').startsWith(ano) && (a.record||a.title))
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const rxs = (pet.prescriptions||[]).filter(r => (r.date||'').startsWith(ano))
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(!atends.length && !rxs.length) return;

    totPac++;
    totAtend += atends.length;
    totRx += rxs.length;
    const t = tutorOf(pet);
    indice.push(`${esc(pet.name)} (${esc(pet.species)}${t?' · tutor: '+esc(t.name):''}) — ${atends.length} atend., ${rxs.length} receita(s)`);

    let corpo = `<div style="page-break-before:always"></div>
      <div style="background:#f0f6f5;border-radius:8px;padding:10px 14px;margin:18px 0 12px">
        <b style="font-size:15px;color:#12294f">🐾 ${esc(pet.name)}</b>
        <span style="font-size:12px;color:#5f7285"> · ${esc(pet.species)}${pet.breed?' · '+esc(pet.breed):''}${t?' · Tutor: '+esc(t.name):''}</span>
      </div>`;

    atends.forEach(a => {
      corpo += `<div style="border-left:3px solid #2DC0AE;padding:6px 0 6px 12px;margin-bottom:12px">
        <div style="font-size:12px;color:#5f7285"><b>${fmtDate(a.date)}</b> · ${esc(a.title||'Atendimento')}${a.clinic?' · '+esc(a.clinic):''}</div>
        ${a.record?`<div style="font-size:13px;line-height:1.7;white-space:pre-wrap;margin-top:4px;color:#1A2F5A">${esc(a.record)}</div>`:'<div style="font-size:12px;color:#9aa8b6;font-style:italic;margin-top:4px">(sem prontuário registrado)</div>'}
      </div>`;
    });

    rxs.forEach(r => {
      corpo += `<div style="border-left:3px solid #7C5CE4;padding:6px 0 6px 12px;margin-bottom:12px">
        <div style="font-size:12px;color:#5f7285"><b>${fmtDate(r.date)}</b> · 📝 Receituário${r.type?' ('+esc(r.type)+')':''}</div>
        <div style="font-size:13px;line-height:1.7;white-space:pre-wrap;margin-top:4px;color:#1A2F5A">${esc(r.content||'')}</div>
        ${r.notes?`<div style="font-size:12px;color:#5f7285;margin-top:3px">Obs: ${esc(r.notes)}</div>`:''}
      </div>`;
    });

    blocos.push(corpo);
  });

  if(!totPac){ toast('Nenhum registro para arquivar em '+ano); return; }

  const v = DB.vet;
  const capa = `${letterheadHTML()}
    <div class="doctitle">ARQUIVO CLÍNICO — ANO ${ano}</div>
    <div style="text-align:center;font-size:12px;color:#5f7285;margin-bottom:22px">
      Documento de guarda de prontuário · gerado em ${fmtDate(todayISO())}
    </div>
    <div style="background:#f0f6f5;border-radius:10px;padding:16px 18px;margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Pacientes atendidos no ano</span><b>${totPac}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid #dce8e6"><span>Atendimentos com prontuário</span><b>${totAtend}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid #dce8e6"><span>Receituários emitidos</span><b>${totRx}</b></div>
    </div>
    <div style="font-size:13px;font-weight:800;color:#12294f;margin-bottom:8px">ÍNDICE POR PACIENTE</div>
    <div style="font-size:12.5px;line-height:1.9;color:#1A2F5A">
      ${indice.map((l,i)=>`${i+1}. ${l}`).join('<br>')}
    </div>
    <div style="margin-top:20px;padding-top:14px;border-top:1px solid #dce8e6;font-size:11px;color:#5f7285;line-height:1.7">
      <b>Responsável técnico:</b> ${esc(v.name||'—')} · CRMV: ${crmvFull()||'—'}<br>
      Documento gerado pelo VetFlowCare para fins de guarda de prontuário, conforme exigência do CFMV (guarda por 20 anos).
    </div>`;

  const inner = capa + blocos.join('');
  closeSheet();
  toast('📄 Gerando arquivo de '+ano+'…');
  setTimeout(() => printShell('Arquivo Clínico '+ano, inner), 300);
}

function uploadDoc(petId, input){
  const file = input.files[0]; if(!file) return;
  if(file.size > 20_000_000){ toast('⚠ Arquivo muito grande (máx 20MB)'); return; }
  const pet = DB.pets.find(p=>p.id===petId);
  // PDF: salva direto no IndexedDB
  if(file.type === 'application/pdf'){
    const r = new FileReader();
    r.onload = async e => {
      const id = uid();
      try{
        await idbPut(id, e.target.result);
        pet.documents.unshift({id, name:file.name, date:todayISO(), kind:'pdf'});
        save(); toast('📄 PDF salvo!'); render();
      }catch(err){ toast('⚠ Erro ao salvar o PDF'); }
    };
    r.readAsDataURL(file);
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const cv = document.createElement('canvas');
      const scale = Math.min(1, 1400/img.width);
      cv.width = img.width*scale; cv.height = img.height*scale;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const id = uid();
      try{
        await idbPut(id, cv.toDataURL('image/jpeg',.8));
        pet.documents.unshift({id, name:file.name, date:todayISO()});
        save(); toast('📄 Documento salvo!'); render();
      }catch(err){ toast('⚠ Erro ao salvar a imagem'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function viewDoc(petId, docId){
  const d = DB.pets.find(p=>p.id===petId)?.documents.find(x=>x.id===docId);
  if(!d) return;
  const data = d.data || await idbGet(d.id);
  if(!data){ toast('⚠ Arquivo não encontrado'); return; }
  d.data = data; // uso temporário abaixo
  if(d.kind === 'pdf'){
    // Converte para Blob (data: URL é bloqueada em novas abas)
    const b64 = d.data.split(',')[1];
    const bytes = atob(b64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type:'application/pdf'}));
    const a = document.createElement('a');
    a.href = url; a.download = d.name;
    a.click();
    delete d.data;
    toast('📄 PDF baixado — abra pela notificação ou pasta Downloads');
    return;
  }
  const w = window.open('');
  if(!w){ toast('⚠ Permita pop-ups para visualizar'); return; }
  w.document.write(`<title>${esc(d.name)}</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${d.data}" style="max-width:100%;max-height:100vh"><div style="position:fixed;right:0;bottom:0;z-index:10001;background:#ffedb5;color:#665328;font:9px Arial;padding:3px 6px;pointer-events:none">TESTES · DADOS SEPARADOS</div></body>`);
  delete d.data;
}

  evts.forEach(e => {
    const dt = new Date(e.due+'T00:00:00');
    if(dt.getFullYear()===y && dt.getMonth()===m) (byDay[dt.getDate()] = byDay[dt.getDate()]||[]).push(e);
  });
  DB.pets.forEach(pet => {
    (pet.appointments||[]).filter(a => a.done).forEach(a => {
      if(!a.date) return;
      const dt = new Date(a.date+'T00:00:00');
      if(dt.getFullYear()===y && dt.getMonth()===m){
        const k = dt.getDate();
        if(!(byDay[k]||[]).some(e=>e.id==='a-'+a.id))
          (byDay[k]=byDay[k]||[]).push({petId:pet.id,pet:pet.name,emo:petEmoji(pet),
            id:'a-'+a.id,type:'vet',title:a.title,due:a.date,daysLeft:daysUntil(a.date),priority:'done',done:true});
      }
    });
  });
  let grid = ['D','S','T','Q','Q','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) grid += '<div></div>';
  for(let d=1;d<=days;d++){
    const isToday = d===now.getDate() && m===now.getMonth() && y===now.getFullYear();
    const isSel = d===calSelDay;
    const de = byDay[d]||[];
    const hasOD = de.some(e=>e.priority==='overdue');
    grid += `<button class="cal-day ${isToday?'today':''} ${isSel?'sel':''}" onclick="calSelect(${d})">${d}
      <div class="dots">${de.slice(0,3).map(()=>`<i class="${hasOD?'od':''}"></i>`).join('')}</div></button>`;
  }
  const sel = calSelDay ? [...(byDay[calSelDay]||[])].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||a.daysLeft-b.daysLeft) : evts.filter(e=>e.daysLeft>=0).slice(0,6);
  // "top" = calendário, botões de ação e o rótulo "Próximos eventos" — fica fixo no topo.
  // Só a lista de eventos abaixo (map evtRow) rola.
  const top = `<h2 style="margin-bottom:14px">Agenda</h2>
    <div class="card">
      <div class="cal-head">
        <button onclick="calShift(-1)">‹</button><b>${MONTHS[m]} ${y}</b><button onclick="calShift(1)">›</button></div>
      <div class="cal-grid">${grid}</div>
      <div class="legend">
        <span><i style="background:var(--vac)"></i>Vacina</span>
        <span><i style="background:var(--med)"></i>Medicação</span>
        <span><i style="background:var(--vet)"></i>Atendimento</span>
        <span><i style="background:var(--warning)"></i>Pagamento</span>
        <span><i style="background:var(--danger)"></i>Vencido</span></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="openApptPicker(${calSelDay?`'${y}-${String(m+1).padStart(2,'0')}-${String(calSelDay).padStart(2,'0')}'`:'null'})">
        ➕ Novo Atendimento</button>
      <button class="btn" style="flex:1;background:var(--vet)" onclick="openRota(${calSelDay?`'${y}-${String(m+1).padStart(2,'0')}-${String(calSelDay).padStart(2,'0')}'`:'null'})">
        🗺️ Rota do dia</button>
    </div>
    <div class="sec-h" style="margin-top:16px">
      <span>${calSelDay?`Dia ${calSelDay} de ${MONTHS[m]}`:'Próximos eventos'}</span></div>`;
  const list = `<div class="sec">${sel.length?sel.map(evtRow).join(''):'<div class="card empty">✅ Nenhum evento neste dia</div>'}</div>`;
  return stickyToolbar(top) + list;
}

let alertFilter = 'all';
function renderAlerts(f){
  if(f) alertFilter = f;
  const evts = allEvents();
  const filtered = evts.filter(e => {
    if(alertFilter==='overdue') return e.priority==='overdue';
    if(alertFilter==='today')   return e.priority==='today';
    if(alertFilter==='upcoming')return e.daysLeft>0;
    return true;
  });
  const od = evts.filter(e=>e.priority==='overdue').length;
  // "top" = título, destaque de vencidos e filtros — fica fixo. Só a lista de cards abaixo rola.
  let top = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2>Alertas</h2>${od?`<span class="st bad" style="padding:5px 10px">🔴 ${od} vencidos</span>`:''}</div>
    <div class="filters">
      ${[['all','Todos'],['overdue','Vencidos'],['today','Hoje'],['upcoming','Próximos']]
        .map(([k,l])=>`<button class="chip ${alertFilter===k?'on':''}"
        onclick="document.getElementById('mainContent').innerHTML=renderAlerts('${k}')">${l}</button>`).join('')}</div>`;
  if(!filtered.length) return stickyToolbar(top) + `<div class="card empty"><div class="big">✅</div>Nenhum alerta nesta categoria</div>`;
  const list = filtered.map(e => {
    const t = TYPE_CFG[e.type], pc = PRI_CLR[e.priority];
    const topLbl = e.priority==='overdue' ? `⚠ VENCIDO HÁ ${Math.abs(e.daysLeft)} DIAS`
      : e.priority==='today' ? '📅 PARA HOJE' : `🔔 FALTAM ${e.daysLeft} DIAS`;
    return `<div class="acard">
      <div class="ah" style="background:color-mix(in srgb,${pc} 10%,var(--surface));color:${pc}">${topLbl}</div>
      <div class="ab">
        <div style="width:42px;height:42px;border-radius:13px;background:${t.bg};display:flex;align-items:center;justify-content:center;font-size:19px">${t.emo}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(e.title)}</div>
          <div style="color:var(--muted);font-size:12px">${e.emo} ${esc(e.pet)} · ${fmtDate(e.due)}</div></div>
        <button class="btn sm ${e.priority==='overdue'?'danger':'success'}"
          onclick="${e.type==='pay' ? 'goFinance()' : (e.type==='vet' && e.priority==='overdue') ? "markApptDone('"+e.petId+"','"+e.id.slice(2)+"')" : "openPet('"+e.petId+"');currentPetTab='health'"}">${(e.type==='vet'&&e.priority==='overdue')?'✓ Concluir':e.priority==='overdue'?'Resolver':'Ver'}</button>
      </div>
      ${e.type!=='pay' ? `<div style="padding:0 13px 12px">
        <button class="btn sm" style="background:#25D366;width:100%"
          onclick="openAvisarTutor('${e.petId}','${e.type==='vaccine'?'vacina':e.type==='medication'?'med':'atend'}','${e.id.slice(2)}')">💬 Avisar o tutor pelo WhatsApp</button></div>` : ''}
      </div>`;
  }).join('');
  return stickyToolbar(top) + list;
}

// linha de configuração de uma taxa (input percentual)
function taxaRow(meio, label){
  const t = (DB.settings.taxas && DB.settings.taxas[meio]) || 0;
  return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
    <span style="flex:1;font-size:14px">${label}</span>
    <div style="display:flex;align-items:center;gap:6px">
      <input type="number" step="0.01" min="0" max="100" value="${t}" id="taxa_${meio}"
        aria-label="Taxa de ${esc(label)} em porcentagem"
        onchange="salvarTaxa('${meio}', this.value)"
        style="width:80px;text-align:right;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px">
      <span style="font-size:14px;color:var(--muted);font-weight:700">%</span>
    </div></div>`;
}
function salvarTaxa(meio, valor){
  const v = parseFloat(valor);
  if(!DB.settings.taxas) DB.settings.taxas = {};
  DB.settings.taxas[meio] = (isFinite(v) && v >= 0) ? v : 0;
  save();
  toast('💳 Taxa atualizada');
}

          <div style="font-size:12px;color:var(--muted);margin-top:2px">Seus dados estão salvos. Assine o Pro para desbloquear tudo.</div>

  return `<div class="sec"><div class="card" style="border:1.5px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:26px">🐾</span>

        <div style="font-size:12px;color:var(--muted);margin-top:2px">Até ${FREE_PET_LIMIT} pacientes. Assine o Pro para liberar tudo.</div>
      </div>
    </div>
    <button class="btn" style="background:var(--rx);margin-top:12px" onclick="openProModal()">✨ Assinar o Plano Pro</button>

function uploadVetImg(field, input){
  if(!isPro()){
    input.value = '';
    openProModal('Logo e assinatura eletrônica nos documentos são recursos Pro.');
    return;
  }
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      const scale = Math.min(1, 500/img.width);
      cv.width = img.width*scale; cv.height = img.height*scale;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      DB.vet[field] = cv.toDataURL('image/png');
      try{ save(); render(); toast(field==='logo'?'🖼️ Logo salvo!':'✍️ Assinatura salva!'); }
      catch(err){ DB.vet[field]=null; toast('⚠ Imagem muito grande'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ═══════════ IMPORTAÇÃO DE OUTRO SISTEMA (CSV) ═══════════
function csvParse(text){
  text = text.replace(/^\uFEFF/, '');
  const nl = text.indexOf('\n');
  const first = nl > -1 ? text.slice(0, nl) : text;
  const nT = (first.match(/\t/g)||[]).length, nS = (first.match(/;/g)||[]).length, nC = (first.match(/,/g)||[]).length;
  const delim = nT > nS && nT > nC ? '\t' : (nS >= nC ? ';' : ',');
  const rows = [];
  let row = [''], inQ = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){
        if(text[i+1] === '"'){ row[row.length-1] += '"'; i++; }
        else inQ = false;
      } else row[row.length-1] += ch;
    }
    else if(ch === '"') inQ = true;
    else if(ch === delim) row.push('');
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      if(row.length > 1 || row[0].trim() !== '') rows.push(row.map(c=>c.trim()));
      row = [''];
    }
    else row[row.length-1] += ch;
  }
  if(row.length > 1 || row[0].trim() !== '') rows.push(row.map(c=>c.trim()));
  if(!rows.length) return {headers:[], rows:[]};
  return {headers: rows[0], rows: rows.slice(1).filter(r => r.some(c => c !== ''))};
}
const IMP_FIELDS = [
  {k:'tNome',  label:'👤 Nome do tutor (obrigatório)', rx:/cliente|tutor|propriet|respons|dono/i, rx2:/^nome$/i},
  {k:'tFone',  label:'📞 Telefone / WhatsApp', rx:/fone|celular|whats|contato/i},
  {k:'tEmail', label:'✉️ E-mail', rx:/mail/i},
  {k:'tCpf',   label:'🪪 CPF', rx:/cpf/i},
  {k:'tBairro',label:'🏘️ Bairro', rx:/bairro/i},
  {k:'tEnd',   label:'📍 Endereço', rx:/endere|logradouro|rua/i},
  {k:'tCep',   label:'📮 CEP', rx:/cep/i},
  {k:'pNome',  label:'🐾 Nome do animal', rx:/animal|pet|paciente/i},
  {k:'pEsp',   label:'Espécie', rx:/esp[eé]cie/i},
  {k:'pRaca',  label:'Raça', rx:/ra[cç]a/i},
  {k:'pSexo',  label:'Sexo', rx:/sexo|g[eê]nero/i},
  {k:'pNasc',  label:'🎂 Nascimento', rx:/nasc/i},
  {k:'pPeso',  label:'⚖️ Peso', rx:/peso/i},
  {k:'pChip',  label:'Microchip', rx:/chip/i}
];
function impGuessMap(headers){
  const map = {}, used = new Set();
  IMP_FIELDS.forEach(f => {
    let idx = headers.findIndex((h,i) => !used.has(i) && f.rx.test(h));
    if(idx === -1 && f.rx2) idx = headers.findIndex((h,i) => !used.has(i) && f.rx2.test(h));
    if(idx > -1){ map[f.k] = idx; used.add(idx); }
  });
  return map;
}
function impNormEsp(v){
  v = (v||'').toLowerCase();
  if(/c[ãa]o|canin|cachorr|dog/.test(v)) return 'Cão';
  if(/gat|felin|cat/.test(v)) return 'Gato';
  if(/ave|p[áa]ssar|bird|calopsit|papagai/.test(v)) return 'Ave';
  return v ? 'Outro' : 'Cão';
}
function impNormSexo(v){ return /f/i.test(v||'') ? 'Fêmea' : 'Macho'; }
function impDate(v){
  v = (v||'').trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(v);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/.exec(v);
  if(m){ const y = parseInt(m[3]) <= 26 ? '20'+m[3] : '19'+m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}

function impFileRead(input){
  const f = input.files[0]; if(!f) return;
  const read = enc => {
    const r = new FileReader();
    r.onload = e => {
      const text = e.target.result;
      if(enc === 'UTF-8' && text.includes('\uFFFD')){ read('ISO-8859-1'); return; }
      const parsed = csvParse(text);
      if(!parsed.headers.length || !parsed.rows.length){
        toast('⚠ Arquivo vazio ou formato não reconhecido'); return;
      }
      window._imp = {headers: parsed.headers, rows: parsed.rows, map: impGuessMap(parsed.headers)};
      impStep2();
    };
    r.readAsText(f, enc);
  };
  read('UTF-8');
}
function impStep2(){
  const I = window._imp;
  showSheet('📥 Conferir colunas (passo 2 de 3)', `
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">
    Encontrei <b>${I.rows.length} linhas</b>. Confira se cada informação aponta para a coluna certa da sua planilha:</div>
    ${IMP_FIELDS.map(f => `
      <label>${f.label}</label>
      <select id="impMap_${f.k}">
        <option value="-1">— não importar —</option>
        ${I.headers.map((h,i) => `<option value="${i}" ${I.map[f.k]===i?'selected':''}>${esc(h||('coluna '+(i+1)))}</option>`).join('')}
      </select>`).join('')}`,
    `<button class="btn gray" onclick="openImportWizard()">‹ Voltar</button>
     <button class="btn" onclick="impStep3()">Continuar →</button>`);
}
function impStep3(){
  const I = window._imp;
  IMP_FIELDS.forEach(f => {
    const v = parseInt(document.getElementById('impMap_' + f.k)?.value ?? -1);
    I.map[f.k] = v >= 0 ? v : undefined;
  });
  if(I.map.tNome === undefined){ toast('⚠ Aponte qual coluna tem o nome do tutor'); return; }
  const g = (row, k) => I.map[k] !== undefined ? (row[I.map[k]] || '').trim() : '';
  const digits = s => (s||'').replace(/\D/g,'');
  // Monta o plano
  const tutMap = {}; let skipped = 0, reusedT = 0, pets = [], dupP = 0;
  I.rows.forEach(row => {
    const nome = g(row,'tNome');
    if(!nome){ skipped++; return; }
    const key = nome.toLowerCase() + '|' + digits(g(row,'tFone'));
    if(!tutMap[key]){
      const existing = DB.tutors.find(t =>
        t.name.toLowerCase() === nome.toLowerCase() &&
        (!g(row,'tFone') || digits(t.phone) === digits(g(row,'tFone'))));
      if(existing){ tutMap[key] = {id: existing.id, existing: true}; reusedT++; }
      else tutMap[key] = {id: null, existing: false,
        data: {name: nome, phone: g(row,'tFone'), email: g(row,'tEmail'),
               cpf: g(row,'tCpf'), bairro: g(row,'tBairro'), address: g(row,'tEnd'), cep: g(row,'tCep')}};
    }
    const pNome = g(row,'pNome');
    if(pNome){
      const esp = impNormEsp(g(row,'pEsp'));
      const already = DB.pets.some(p => p.name.toLowerCase() === pNome.toLowerCase() &&
        tutMap[key].existing && p.tutorId === tutMap[key].id);
      if(already){ dupP++; return; }
      pets.push({tutKey: key, data: {name: pNome, species: esp, breed: g(row,'pRaca') || 'SRD',
        gender: impNormSexo(g(row,'pSexo')), birth: impDate(g(row,'pNasc')),
        weight: parseFloat((g(row,'pPeso')||'').replace(',','.')) || 0,
        microchip: g(row,'pChip')}});
    }
  });
  const newTutors = Object.values(tutMap).filter(t => !t.existing).length;
  let limitNote = '', petCount = pets.length;
  if(!isPro()){
    const room = Math.max(0, FREE_PET_LIMIT - DB.pets.length);
    if(pets.length > room){
      limitNote = `<div style="background:rgba(240,165,0,.1);border:1.5px solid var(--warning);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px">
        ⚠ <b>Plano gratuito (limite de ${FREE_PET_LIMIT} animais):</b> serão importados só os <b>${room} primeiros</b> animais de ${pets.length}. Ative o ✨ Pro para importar todos.</div>`;
      petCount = room;
    }
  }
  I.plan = {tutMap, pets, petCount};
  const prev = I.rows.slice(0,3).map(row =>
    `<tr><td style="padding:5px 8px;border-bottom:1px solid var(--border)">${esc(g(row,'tNome')||'—')}</td>
     <td style="padding:5px 8px;border-bottom:1px solid var(--border)">${esc(g(row,'pNome')||'—')}</td>
     <td style="padding:5px 8px;border-bottom:1px solid var(--border)">${esc(impNormEsp(g(row,'pEsp')))}</td></tr>`).join('');
  showSheet('📥 Confirmar importação (passo 3 de 3)', `
    <div class="card" style="text-align:center">
      <div style="font-size:15px"><b>${newTutors}</b> tutores novos${reusedT?` · <b>${reusedT}</b> já existiam (serão aproveitados)`:''}</div>

async function saveFileSAF(name, blob){
  // 1) Desktop/Chrome com seletor de arquivo nativo
  if(window.showSaveFilePicker){
    try{
      const h = await showSaveFilePicker({suggestedName:name});
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      toast('💾 Backup salvo!');
      return true;
    }catch(e){ if(e.name === 'AbortError') return true; }
  }
  // 2) Android/celular: oferece escolher o destino (Arquivos/Drive/WhatsApp) ou baixar direto
  window._pendFile = {name, blob};
  let canShare = false;
  try{ canShare = !!(navigator.canShare && navigator.canShare({files:[new File([blob], name, {type:'application/json'})]})); }catch(e){}
  if(canShare){
    vfcConfirm({icon:'💾', title:'Onde salvar o backup?',
      msg:`<b style="font-size:12px;word-break:break-all">${esc(name)}</b>`,
      note:'📤 "Escolher destino" abre o menu do celular: salve numa pasta (app Arquivos), no Google Drive ou envie no WhatsApp.', noteColor:'var(--vac)',
      noLabel:'⬇️ Baixar direto', no:'dlPendFile()',
      yesLabel:'📤 Escolher destino', yesBg:'var(--primary)', yes:'sharePendFile()'});
    return true;
  }
  dlPendFile();
  return true;
}
function dlPendFile(){

async function sharePendFile(){

    toast('💾 Backup enviado ao destino escolhido!');

async function completeBackupSnapshot(){
  const snapshot=JSON.parse(JSON.stringify(DB));
  const documents=[...snapshot.pets.flatMap(p=>p.documents||[]),...(snapshot.tutors||[]).filter(t=>t.ficha).map(t=>t.ficha)];

    if(!doc.data)doc.data=await idbGet(doc.id);
    if(!doc.data)throw new Error('Anexo indisponível: '+(doc.name||doc.id));
  }
  return snapshot;
}
